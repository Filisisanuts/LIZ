<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>经营报表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Noto+Serif+SC:wght@400;700&family=Lexend:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="js/utils.js" defer></script>
<script src="js/inventory.js" defer></script>
<script src="js/nav.js" defer></script>
<script src="js/report.js" defer></script>
<link rel="stylesheet" href="css/style.css?v=3">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f7f4ee;--card:#fff;--card-h:#faf8f3;--bd:#e5dfd4;--bd-l:#ece8df;--ac:#b08d57;--ac-h:#c9a86c;--tx:#2c2c2c;--tx-s:#666;--tx-m:#aaa;--gn:#3d8b5e;--gn-b:rgba(61,139,94,.06);--rd:#c75450;--rd-b:rgba(199,84,80,.06);--og:#d4a017;--og-b:rgba(212,160,23,.07);--r:8px;--sh:0 1px 4px rgba(0,0,0,.04);--sh2:0 4px 16px rgba(0,0,0,.06)}
body{background:var(--bg);color:var(--tx);font-family:'Noto Serif SC',Georgia,serif;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:24px 20px 70px}
.sec{font-size:.7rem;color:var(--tx-m);letter-spacing:.08em;text-transform:uppercase;margin:22px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--bd-l)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:15px;box-shadow:var(--sh);overflow:hidden;min-width:0}
.card-l{font-size:.65rem;color:var(--tx-m);margin-bottom:2px;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-v{font-family:'DM Mono','Lexend',monospace;font-size:1rem;font-weight:500;word-break:break-all}
.card-v.gn{color:var(--gn)}.card-v.rd{color:var(--rd)}.card-v.ac{color:var(--ac)}.card-v.og{color:var(--og)}
@media(max-width:600px){.cards{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}.card{padding:8px}.card-l{font-size:.6rem}.card-v{font-size:.82rem;word-break:break-word}}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:var(--r);background:var(--card);margin-bottom:14px}
table{width:100%;border-collapse:collapse}
th{background:var(--card-h);font-size:.66rem;color:var(--tx-s);text-align:left;padding:9px 10px;border-bottom:1px solid var(--bd);font-weight:600;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--bd-l);font-size:.78rem;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--card-h)}
.nr{text-align:right;font-family:'DM Mono','Lexend',monospace}
.total-row td{background:var(--card-h);font-weight:600}
@media(max-width:768px){
    .tw{width:100%!important}
    table{width:100%!important}
    th,td{padding:8px 8px;font-size:.75rem}
    .nr{text-align:right}
}
.chart-box{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:14px}
.loading{text-align:center;padding:60px 20px;color:var(--tx-m);font-size:.88rem}
.loading .spinner{display:inline-block;width:24px;height:24px;border:2.5px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:30px;color:var(--tx-m);font-size:.78rem}
/* 标签栏 — 与主系统一致 */
.rep-nav{display:flex;gap:0;overflow-x:auto;margin-bottom:20px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);scrollbar-width:none}
.rep-nav::-webkit-scrollbar{display:none}
.rep-tab{flex-shrink:0;padding:10px 16px;font-size:.76rem;color:var(--tx-m);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:all .2s;white-space:nowrap;font-family:'Noto Serif SC',serif}
.rep-tab:hover{color:var(--tx)}
.rep-tab.active{color:var(--ac);border-bottom-color:var(--ac);font-weight:600}
.refresh-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);padding:8px 20px;text-align:center;font-size:.68rem;color:var(--tx-m);display:flex;align-items:center;justify-content:center;gap:10px}
.refresh-btn{background:none;border:1px solid var(--bd);border-radius:6px;padding:4px 12px;font-size:.68rem;color:var(--tx-s);cursor:pointer;font-family:inherit}
.refresh-btn:hover{background:var(--card-h);border-color:var(--ac);color:var(--ac)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:500}
.overlay.show{display:block}
.modal{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:22px;width:92%;max-width:600px;z-index:501;box-shadow:var(--sh2);cursor:default}
.modal.show{display:block}
.rep-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;align-items:start}
.rep-grid>*{min-width:0}
.rep-grid .chart-box{margin-bottom:0}
.rep-grid canvas{max-width:100%!important}
.rep-grid-wide{grid-template-columns:1fr .7fr}
@media(max-width:768px){.rep-grid,.rep-grid-wide{display:flex;flex-direction:column;gap:14px}.rep-grid .tw{overflow-x:auto;width:100%}.rep-grid .tw table{min-width:100%}}
@media(max-width:600px){.cards{grid-template-columns:repeat(2,1fr)}.wrap{padding:16px 12px 70px}.rep-grid .tw{width:100%}}
.sec-head{margin-bottom:16px}
.sec-head h4{font-size:.92rem;color:var(--ac);margin:0 0 4px;font-weight:600}
.sec-head p{font-size:.72rem;color:var(--tx-m);margin:0}
.btn{padding:7px 16px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-family:inherit;font-size:.78rem;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--card-h)}
.btn.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.btn.p:hover{background:var(--ac-h)}
.btn.s{padding:4px 10px;font-size:.7rem}
.btn.d{color:var(--rd);border-color:var(--rd);background:rgba(199,84,80,.06)}
.btn.d:hover{background:rgba(199,84,80,.12)}
.btn.og{color:var(--og);border-color:var(--og);background:var(--og-b)}
.btn.og:hover{background:rgba(212,160,23,.12)}
.brow{display:flex;gap:7px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap" id="app">
    <div class="loading"><div class="spinner"></div><div>正在加载经营数据...</div></div>
</div>
<div class="wrap" id="mainContent"></div>
<div class="refresh-bar">
    <span id="updateTime">--</span>
    <button class="refresh-btn" onclick="loadData()">刷新数据</button>
</div>
<div class="overlay" id="overlay"></div>
<div class="modal" id="modal"></div>

<script>
var DB=null,_charts={},_curTab='profit';
var _sb={client:null,ready:false};
var _SB_URL='https://aahvuwdifuqhwyanrvwj.supabase.co';
var _SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhaHZ1d2RpZnVxaHd5YW5ydndqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyMDc5MzMsImV4cCI6MjA5NDc4MzkzM30.6DByxb_Pk_wGVzp189SslD3B8gDoY9H7CpyWEySgFS8';

function sbInit(){
    if(typeof supabase==='undefined'){console.warn('Supabase SDK未加载');return;}
    _sb.client=supabase.createClient(_SB_URL,_SB_KEY);
    _sb.ready=true;
    console.log('Supabase已连接');
}

// 页面加载时立即调用
loadData();

function loadData(){
    console.log('开始加载数据...');
    var url='https://aahvuwdifuqhwyanrvwj.supabase.co/rest/v1/cafe_data?select=data,updated_at&id=eq.shop_data';
    var headers={
        'apikey':'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhaHZ1d2RpZnVxaHd5YW5ydndqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyMDc5MzMsImV4cCI6MjA5NDc4MzkzM30.6DByxb_Pk_wGVzp189SslD3B8gDoY9H7CpyWEySgFS8',
        'Authorization':'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhaHZ1d2RpZnVxaHd5YW5ydndqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyMDc5MzMsImV4cCI6MjA5NDc4MzkzM30.6DByxb_Pk_wGVzp189SslD3B8gDoY9H7CpyWEySgFS8'
    };
    console.log('请求URL:',url);
    fetch(url,{headers:headers}).then(function(resp){
        console.log('请求完成，状态:',resp.status);
        if(!resp.ok){
            throw new Error('请求失败:'+resp.status);
        }
        return resp.json();
    }).then(function(data){
        console.log('JSON解析完成');
        console.log('数据类型:',typeof data);
        console.log('是否为数组:',Array.isArray(data));
        console.log('数组长度:',data.length);
        if(data.length>0){
            console.log('第一项:',data[0]);
            console.log('data字段:',data[0].data);
        }
        if(!data||!data.length||!data[0].data){
            console.log('无有效数据');
            document.getElementById('app').innerHTML='<div class="empty">暂无经营数据</div>';
            return;
        }
        console.log('数据有效，开始设置DB');
        DB=data[0].data;
        console.log('DB已设置');
        document.getElementById('updateTime').textContent='数据更新：'+new Date(data[0].updated_at).toLocaleString('zh-CN');
        console.log('时间已更新，开始渲染');
        render();
        console.log('渲染完成');
    }).catch(function(e){
        console.error('加载异常:',e);
        console.error('错误名称:',e.name);
        console.error('错误消息:',e.message);
        document.getElementById('app').innerHTML='<div class="empty">加载失败：'+e.message+'</div>';
    });
}

function fmt(n){return n==null?'-':n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtC(n){return(n<0?'-':'')+fmt(Math.abs(n))}
function curYM(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}

// 从URL获取参数
function getUrlParam(name) {
    var params = new URLSearchParams(window.location.search);
    return params.get(name);
}

// 获取选定的月份（优先使用URL参数）
function getSelectedYM() {
    var urlMonth = getUrlParam('month');
    return urlMonth || curYM();
}

// 获取选定的数据类型
function getSelectedType() {
    return getUrlParam('type') || 'all';
}
function td(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function getMR(ym){return(DB.dailyReports||[]).filter(function(r){return r.date.startsWith(ym)})}

function render(){
    if(!DB){
        console.log('DB为空，不渲染');
        return;
    }
    console.log('开始渲染，DB存在');
    // 隐藏app，显示mainContent
    var app = document.getElementById('app');
    var main = document.getElementById('mainContent');
    if(app) app.style.display='none';
    if(main){
        main.style.display='block';
        console.log('mainContent已显示');
    }
    // 直接调用report.js中的rReport()函数
    try{
        rReport();
        console.log('rReport调用成功');
    }catch(e){
        console.error('rReport调用失败:', e);
        if(main) main.innerHTML='<div class="empty">渲染失败：'+e.message+'</div>';
    }
}

// 日详情弹窗
function showPurDay(date){
    var dayPurchases=DB.purchases.filter(function(p){return p.date===date});
    if(!dayPurchases.length)return;
    var allItems=[];
    dayPurchases.forEach(function(p){(p.items||[]).forEach(function(item){
        allItems.push({name:item.name,section:item.section||'未分区',category:item.category||'',source:item.source||p.source||'外购',qty:item.qty||0,unit:item.unit||'',unitPrice:item.unitPrice||0,total:item.total||0})})});
    var total=allItems.reduce(function(s,i){return s+i.total},0);
    var dateLabel=date.substring(5).replace('-','/');

    var h='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">';
    h+='<h3 style="margin:0">'+dateLabel+' 采购明细</h3>';
    h+='<span style="font-size:.95rem;font-weight:700;color:var(--ac)">¥'+fmtC(total)+'</span></div>';

    // 按来源分组
    var groups={};allItems.forEach(function(item){
        if(!groups[item.source])groups[item.source]=[];
        groups[item.source].push(item)});
    Object.keys(groups).forEach(function(src){
        var srcTotal=groups[src].reduce(function(s,i){return s+i.total},0);
        h+='<div style="font-size:.78rem;font-weight:600;color:var(--ac);margin:12px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--bd-l)">'+src+' · ¥'+fmtC(srcTotal)+'</div>';
        h+='<div class="tw" style="margin-bottom:8px"><table><tr><th>商品</th><th>区域</th><th class="nr">数量</th><th class="nr">单价</th><th class="nr">金额</th></tr>';
        groups[src].forEach(function(item){
            h+='<tr><td>'+item.name+'</td><td>'+item.section+'</td><td class="nr">'+item.qty+' '+(item.unit||'')+'</td><td class="nr">'+fmt(item.unitPrice)+'</td><td class="nr" style="font-weight:600">'+fmtC(item.total)+'</td></tr>'});
        h+='</table></div>';
    });
    h+='<div style="text-align:right;margin-top:8px"><button class="btn" onclick="closeModal()">关闭</button></div>';

    showModal(h, 600);
}

// ===== 图表 =====
function initChart(D){
    if(typeof Chart==='undefined')return;
    Chart.defaults.color='#7a7570';Chart.defaults.font.family="'DM Mono','Lexend',monospace";
    if(_curTab==='profit'){
        var ctx=document.getElementById('repChart');if(!ctx)return;
        _charts.c1=new Chart(ctx,{type:'bar',data:{labels:['营收','成本','毛利','费用','利润'],datasets:[{data:[D.mNet,D.netPur,D.grossProfit,D.expTotal,D.operProfit],backgroundColor:['rgba(201,168,76,.7)','rgba(199,84,80,.5)','rgba(61,139,94,.6)','rgba(212,160,23,.5)','rgba(96,165,250,.6)'],borderRadius:4}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:function(v){return '¥'+v.toLocaleString()}}}}}});
    }else if(_curTab==='revenue'){
        var c1=document.getElementById('repChart1');if(c1){
            _charts.c1=new Chart(c1,{type:'doughnut',data:{labels:['厨房','吧台','外卖','香烟','其他'],datasets:[{data:[D.mKit,D.mBar,D.mDel,D.mCig,D.mOther],backgroundColor:['rgba(201,168,76,.7)','rgba(61,139,94,.6)','rgba(96,165,250,.6)','rgba(167,139,250,.6)','rgba(212,160,23,.5)'],borderWidth:1}]},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{padding:10,font:{size:11}}}}}});
        }
        var c2=document.getElementById('repChart2');if(c2){
            var payItems=[['智能POS',D.mr.reduce(function(s,r){return s+(r.payment?r.payment.pos||0:0)},0)],['建行生活',D.mr.reduce(function(s,r){return s+(r.payment?r.payment.ccbLife||0:0)},0)],['现金',D.mr.reduce(function(s,r){return s+(r.payment?r.payment.cash||0:0)},0)],['会员卡',D.mr.reduce(function(s,r){return s+(r.payment?r.payment.memberCard||0:0)},0)],['外卖',D.mDel]];
            _charts.c2=new Chart(c2,{type:'doughnut',data:{labels:payItems.map(function(i){return i[0]}),datasets:[{data:payItems.map(function(i){return i[1]}),backgroundColor:['rgba(201,168,76,.7)','rgba(96,165,250,.6)','rgba(61,139,94,.6)','rgba(167,139,250,.6)','rgba(212,160,23,.5)'],borderWidth:1}]},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{padding:10,font:{size:11}}}}}});
        }
    }else if(_curTab==='daily'){
        var ctx=document.getElementById('repChart');if(!ctx)return;
        var sorted=D.mr.slice().sort(function(a,b){return a.date.localeCompare(b.date)});
        _charts.c1=new Chart(ctx,{type:'bar',data:{labels:sorted.map(function(r){return parseInt(r.date.split('-')[2])+'日'}),datasets:[
            {label:'实收',data:sorted.map(function(r){return r.revenue.netSales||0}),backgroundColor:'rgba(201,168,76,.55)',borderColor:'#c9a84c',borderWidth:1,borderRadius:3,yAxisID:'y',order:2},
            {label:'客流',data:sorted.map(function(r){return r.guest.count||0}),type:'line',borderColor:'#60a5fa',backgroundColor:'rgba(96,165,250,.08)',fill:true,pointRadius:3,yAxisID:'y1',order:1}
        ]},options:{responsive:true,interaction:{intersect:false,mode:'index'},scales:{y:{position:'left',grid:{color:'rgba(0,0,0,.04)'},ticks:{callback:function(v){return '¥'+v.toLocaleString()}}},y1:{position:'right',grid:{drawOnChartArea:false}}},plugins:{legend:{labels:{usePointStyle:true,pointStyle:'circle',padding:12,font:{size:11}}}}}});
    }else if(_curTab==='guest'){
        var ctx=document.getElementById('repChart');if(!ctx)return;
        var sorted=D.mr.slice().sort(function(a,b){return a.date.localeCompare(b.date)});
        _charts.c1=new Chart(ctx,{type:'bar',data:{labels:sorted.map(function(r){return parseInt(r.date.split('-')[2])+'日'}),datasets:[
            {label:'客流',data:sorted.map(function(r){return r.guest.count||0}),backgroundColor:'rgba(96,165,250,.55)',borderColor:'#60a5fa',borderWidth:1,borderRadius:3,yAxisID:'y',order:2},
            {label:'500+包厢',data:sorted.map(function(r){return r.guest.premiumRoomsToday||0}),type:'line',borderColor:'#c9a84c',backgroundColor:'rgba(201,168,76,.08)',fill:true,pointRadius:3,yAxisID:'y1',order:1}
        ]},options:{responsive:true,interaction:{intersect:false,mode:'index'},scales:{y:{position:'left',grid:{color:'rgba(0,0,0,.04)'}},y1:{position:'right',grid:{drawOnChartArea:false}}},plugins:{legend:{labels:{usePointStyle:true,pointStyle:'circle',padding:12,font:{size:11}}}}}});
    }
}

setInterval(loadData,60000);
</script>
</body>
</html>
