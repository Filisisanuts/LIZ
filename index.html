// 当前编辑的采购单 ID（null 表示新建）
var _editPurId = null;
// 百度OCR配置（与MiMo视觉API互为备选）
var _baiduToken = '', _baiduTokenTime = 0;
var _baiduAK = localStorage.getItem('ax_baidu_ak') || '';
var _baiduSK = localStorage.getItem('ax_baidu_sk') || '';
// 采购明细页折叠状态缓存
var _pfFolds = {};

// ==================== 工具函数 ====================

// 解析采购单中的数量单元格（如 "件"、"斤"）
function parseQty(s) {
    var m = s.match(/([\d.]+)\s*(.*)/);
    return { qty: m ? parseFloat(m[1]) : 0, unit: m ? (m[2] || '').trim() : '' };
}

// 解析"数量×规格"格式（如 "2×500g" → { qty: 2, unit: "500g" }）
function parseQU(cell) {
    var clean = cell.replace(/$$[^)]*$$/g, '').trim();
    var parts = clean.split(/[×*]/);
    var qm = parts[0].match(/([\d.]+)/);
    var q = 0, u = '';
    if (qm) {
        q = parseFloat(qm[1]);
        u = parts[0].replace(/[\d.]+/, '').trim();
    }
    return { qty: q, unit: u };
}

// 获取采购行的单价（优先用 unitPrice，没有则用总价÷数量算出）
function getItemUp(item) {
    return item.unitPrice || (item.qty > 0 ? Math.round(item.total / item.qty * 100) / 100 : 0);
}

// 查找商品的历史采购单价（用于价格对比）
// 返回 { date, unitPrice } 或 null
function findPrevPrice(name, currentDate) {
    var best = null;
    DB.purchases.forEach(function(p) {
        if (p.date >= currentDate) return;
        (p.items || []).forEach(function(i) {
            if (i.name === name) {
                var up = getItemUp(i);
                if (up > 0 && (!best || p.date > best.date)) {
                    best = { date: p.date, unitPrice: up };
                }
            }
        });
    });
    return best;
}

// ------ 粘贴解析 ------

// 粘贴解析核心：解析采购单/出库单文字，提取商品信息
// 支持 Tab分隔、Markdown表格、空格分隔 三种格式
// 自动检测区域标题（厨房/吧台/外场）
function parsePurchase(text) {
    var dm = text.match(/(\d{4})[-\/.年]\s*(\d{1,2})[-\/.月]\s*(\d{1,2})/);
    var isAx = /岸香.*贸易|贸易.*岸香/.test(text);

    var r = { date: td(), items: [], source: '岸香贸易' };
    if (dm) r.date = dm[1] + '-' + String(dm[2]).padStart(2, '0') + '-' + String(dm[3]).padStart(2, '0');
    if (isAx) r.source = '岸香贸易';

    var skipRe = /合计|本页|当日|区域汇总|以下是|好的|已删除|不录入/;
    var curSection = '';

    // 解析每一行
    text.split('\n').forEach(function(raw) {
        var l = raw.trim();
        if (!l) return;

        // 去掉行首emoji和特殊符号
        l = l.replace(/^[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]\s*/u, '');
        l = l.replace(/^\*\*/g, '');
        l = l.replace(/^📌\s*/, '');
        l = l.replace(/^>\s*/g, '');

        // 检测区域标题（厨房/吧台/外场）
        var secMatch = l.match(/^(?:#{1,3}\s*)?(厨房|吧台|外场)(?:\s*[·•\-]|$)/);
        if (secMatch) { curSection = secMatch[1]; return; }

        // 跳过非数据行
        if (skipRe.test(l)) return;
        if (/^#{1,6}\s/.test(l)) return;
        if (/^[-—]{3,}$/.test(l)) return;
        if (/^品名/.test(l)) return;

        // ---- Tab分隔行 ----
        if (l.indexOf('\t') >= 0) {
            var cells = l.split('\t').map(function(s) { return s.trim(); });
            if (cells.length >= 4) {
                var name = cells[0];
                if (name.length < 1 || !/[\u4e00-\u9fa5a-zA-Z]/.test(name)) return;

                var qty = 0, unit = '', unitPrice = 0, total = 0, cat = '';

                if (cells.length >= 6) {
                    var q1 = parseQty(cells[2]); qty = q1.qty; unit = q1.unit;
                    var upParts = cells[3].replace(/,/g, '').split('/');
                    unitPrice = parseFloat(upParts[0]) || 0;
                    if (!unit && upParts[1]) unit = upParts[1].trim();
                    total = parseFloat(cells[4].replace(/,/g, '').replace(/\*+$/, '')) || 0;
                    cat = cells[5] || '';
                } else if (cells.length >= 5) {
                    var q2 = parseQty(cells[1]); qty = q2.qty; unit = q2.unit;
                    var upParts2 = cells[2].replace(/,/g, '').split('/');
                    unitPrice = parseFloat(upParts2[0]) || 0;
                    if (!unit && upParts2[1]) unit = upParts2[1].trim();
                    total = parseFloat(cells[3].replace(/,/g, '').replace(/\*+$/, '')) || 0;
                    cat = cells[4] || '';
                } else {
                    var q3 = parseQty(cells[1]); qty = q3.qty; unit = q3.unit;
                    var upParts3 = cells[2].replace(/,/g, '').split('/');
                    unitPrice = parseFloat(upParts3[0]) || 0;
                    if (!unit && upParts3[1]) unit = upParts3[1].trim();
                    total = parseFloat(cells[3].replace(/,/g, '').replace(/\*+$/, '')) || 0;
                }

                if (!unitPrice && total > 0 && qty > 0) unitPrice = Math.round(total / qty * 100) / 100;
                if (qty > 0 && total > 0) {
                    r.items.push({ name: name, section: curSection, category: cat, qty: qty, unit: unit, unitPrice: unitPrice, total: total, source: r.source });
                }
            }
            return;
        }

        // ---- Markdown表格行 ----
        if (/^\|/.test(l)) {
            l = l.replace(/^\|/, '').replace(/\|\s*$/, '');
            var cells = l.split('|').map(function(s) { return s.trim(); });
            if (cells.length > 0 && /^[:\-—]+$/.test(cells[0])) return;

            if (cells.length >= 4) {
                var name = cells[0];
                if (name.length < 1 || !/[\u4e00-\u9fa5a-zA-Z]/.test(name)) return;

                var qty = 0, unit = '', unitPrice = 0, total = 0, cat = '';

                if (cells.length >= 6) {
                    var q1 = parseQty(cells[2]); qty = q1.qty; unit = q1.unit;
                    var upParts = cells[3].replace(/,/g, '').split('/');
                    unitPrice = parseFloat(upParts[0]) || 0;
                    if (!unit && upParts[1]) unit = upParts[1].trim();
                    total = parseFloat(cells[4].replace(/,/g, '').replace(/\*+$/, '')) || 0;
                    cat = cells[5] || '';
                } else if (cells.length >= 5) {
                    var q2 = parseQty(cells[1]); qty = q2.qty; unit = q2.unit;
                    var upParts2 = cells[2].replace(/,/g, '').split('/');
                    unitPrice = parseFloat(upParts2[0]) || 0;
                    if (!unit && upParts2[1]) unit = upParts2[1].trim();
                    total = parseFloat(cells[3].replace(/,/g, '').replace(/\*+$/, '')) || 0;
                    cat = cells[4] || '';
                } else {
                    var q3 = parseQty(cells[1]); qty = q3.qty; unit = q3.unit;
                    var upParts3 = cells[2].replace(/,/g, '').split('/');
                    unitPrice = parseFloat(upParts3[0]) || 0;
                    if (!unit && upParts3[1]) unit = upParts3[1].trim();
                    total = parseFloat(cells[3].replace(/,/g, '').replace(/\*+$/, '')) || 0;
                }

                if (!unitPrice && total > 0 && qty > 0) unitPrice = Math.round(total / qty * 100) / 100;
                if (qty > 0 && total > 0) {
                    r.items.push({ name: name, section: curSection, category: cat, qty: qty, unit: unit, unitPrice: unitPrice, total: total, source: r.source });
                }
            }
            return;
        }

        // ---- 空格分隔行 ----
        var m = l.match(/^(.+)\s+(\d+\.?\d*\S*)\s+(\d+\.?\d*\S*)\s+(\d+\.?\d*)\s*$/);
        if (!m) return;

        var name = m[1].trim();
        if (name.length < 1 || !/[\u4e00-\u9fa5a-zA-Z]/.test(name)) return;

        var qm = m[2].match(/([\d.]+)\s*(.*)/);
        var qty = qm ? parseFloat(qm[1]) : 0;
        var unit = qm ? (qm[2] || '').trim() : '';

        var upParts = m[3].replace(/,/g, '').split('/');
        var unitPrice = parseFloat(upParts[0]) || 0;
        if (!unit && upParts[1]) unit = upParts[1].trim();

        var total = parseFloat(m[4].replace(/,/g, '')) || 0;

        if (!unitPrice && total > 0 && qty > 0) unitPrice = Math.round(total / qty * 100) / 100;
        if (qty > 0 && total > 0) {
            r.items.push({ name: name, section: curSection, category: '', qty: qty, unit: unit, unitPrice: unitPrice, total: total, source: r.source });
        }
    });

    // 数量校正：如果单价×数量≠总价，用总价÷单价反推数量
    r.items.forEach(function(item) {
        if (item.total > 0 && item.unitPrice > 0) {
            var eq = Math.round(item.total / item.unitPrice);
            if (eq > 0 && eq !== item.qty) item.qty = eq;
        }
    });

    return r;
}

// 粘贴解析入口：调用 parsePurchase 解析文字 → 填入手动录入表单
function doParsePur() {
    var text = $id('ptInput').value.trim();
    if (!text) { toast('请先粘贴采购单文字'); return; }

    var result = parsePurchase(text);
    if (!result.items.length) { toast('未识别到物品，请检查文字格式'); return; }

    // 转换为统一格式
    _pmItems = result.items.map(function(item) {
        var qty = parseFloat(item.qty) || 0;
        var total = parseFloat(item.total) || 0;
        var unitPrice = parseFloat(item.unitPrice) || 0;
        if (!unitPrice && total > 0 && qty > 0) unitPrice = Math.round(total / qty * 100) / 100;
        return {
            name: item.name || '',
            section: item.section || '',
            category: '',
            qty: qty,
            unit: item.unit || '',
            unitPrice: unitPrice,
            total: total,
            source: result.source || '岸香贸易'
        };
    });

    // 切换到手动标签页，填入日期和来源
    switchPT('manual');
    setTimeout(function() {
        if ($id('pmDate')) $id('pmDate').value = result.date;
        if ($id('pmSrc')) $id('pmSrc').value = '岸香贸易';
        renderPML();
        toast('已识别 ' + _pmItems.length + ' 项物品');
    }, 100);
}

// 切换采购标签页（粘贴/手动/明细）
function switchPT(t) {
    var tabs = ['text', 'manual', 'hist'];
    document.querySelectorAll('#pT .tab-btn').forEach(function(b, i) {
        b.classList.toggle('active', tabs[i] === t);
    });
    ['pText', 'pMan', 'pHist'].forEach(function(id, i) {
        var el = $id(id);
        if (el) el.style.display = tabs[i] === t ? '' : 'none';
    });
    if (t === 'manual' && _pmItems.length === 0 && !_editPurId) _pmItems = [];
    renderPML();
    if (t === 'hist') setTimeout(renderPHist, 50);
}

// 批量填充时区域下拉变化：更新分类下拉选项
function batchSecChanged(sel) {
    var area = sel.value;
    var catSel = $id('pmBatchCat');
    if (!catSel) return;

        catSel.innerHTML = '<option value="">请先选区域</option>';

// 批量填充手动录入表格中所有行的来源/区域/分类
function batchFillAll() {
    var src = ($id('pmBatchSrc') || {}).value || '';
    var sec = ($id('pmBatchSec') || {}).value || '';
    var cat = ($id('pmBatchCat') || {}).value || '';
    if (!src && !sec && !cat) { toast('请选择要填充的值'); return; }

    _pmItems.forEach(function(item) {
        if (src) item.source = src;
        if (sec) item.section = sec;
        if (cat) item.category = cat;
    });

    renderPML();
    toast('已填充全部');
}

// 手动录入表格：强制覆盖所有行的指定字段
function batchSetField(field, value) {
    if (!value) return;
    _pmItems.forEach(function(item) { item[field] = value; });
    renderPML();
    toast('已填充');
}

// 自动计算单价：总价 ÷ 数量
function calcUnitPrice() {
    var q = parseFloat($id('pmQty').value);
    var t = parseFloat($id('pmTotal').value);
    if (q > 0 && t > 0) $id('pmUnitPrice').value = (Math.round(t / q * 100) / 100).toFixed(2);
}

// 自动计算总价：数量 × 单价
function calcTotal() {
    var q = parseFloat($id('pmQty').value);
    var up = parseFloat($id('pmUnitPrice').value);
    if (q > 0 && up > 0) $id('pmTotal').value = (Math.round(q * up * 100) / 100).toFixed(2);
}

// 添加单个物品到采购列表
// 填完品名、数量、单价/总价后点"添加"，自动清空输入框并聚焦品名
function addPurItem() {
    var n = $id('pmName').value.trim();
    if (!n) { toast('填品名'); return; }

    var q = parseFloat($id('pmQty').value) || 0;
    var t = parseFloat($id('pmTotal').value) || 0;
    var up = parseFloat($id('pmUnitPrice').value) || 0;

    if (!up && q > 0 && t > 0) up = Math.round(t / q * 100) / 100;

    var sec = getSelVal('pmSec', 'pmSecC');
    var cat = getSelVal('pmCat', 'pmCatC');

    _pmItems.push({
        name: n, section: sec, category: cat,
        qty: q, unit: $id('pmUnit').value.trim(),
        unitPrice: up, total: t, source: $id('pmSrc').value
    });

    // 聚焦品名并选中文本，方便连续输入
    $id('pmName').focus();
    $id('pmName').select();
    $id('pmQty').value = '';
    $id('pmTotal').value = '';
    $id('pmUnitPrice').value = '';
    $id('pmUnit').value = '';

    renderPML();
}

function rebuildSel(sel, field, value) {

    presets.forEach(function(o) { html += '<option' + (o === value ? ' selected' : '') + '>' + o + '</option>'; });

        });

        // 合计行
        var sum = _pmItems.reduce(function(s, i) { return s + (i.total || 0); }, 0);
        h += '</table>';

        h += '<span style="color:var(--tx-m)">本次合计：</span>';
        h += '<span style="color:var(--ac);font-family:var(--fm);margin-left:6px">¥' + fmtC(sum) + '</span>';
        h += '</div></div>';
    }

    el.innerHTML = h;

// 表格单元格编辑：更新 _pmItems 中指定行的字段
function pmEdit(idx, field, val) {
    if (!_pmItems[idx]) return;
    if (field === 'qty' || field === 'total' || field === 'unitPrice') {
        _pmItems[idx][field] = parseFloat(val) || 0;
    } else {
        _pmItems[idx][field] = val;
    }
}

// 处理分类/区域下拉框的特殊值：__custom（弹窗输入）、__clear（清空）
function pmEditSel(idx, field, val) {
    if (val === '__clear') { _pmItems[idx][field] = ''; renderPML(); return; }
    if (val === '__custom') {
        setTimeout(function() {
            var v = prompt('输入' + (field === 'section' ? '区域' : '分类'));
            if (!v || !v.trim()) { renderPML(); return; }
            v = v.trim();
            _pmItems[idx][field] = v;
            var row = document.querySelectorAll('#pmList .tw table tr')[idx + 1];
            if (row) {
                var sels = row.querySelectorAll('select');
                var si = field === 'section' ? 0 : 1;
                if (sels[si]) {
                    var found = false;
                    for (var i = 0; i < sels[si].options.length; i++) {
                        if (sels[si].options[i].value === v) { found = true; break; }
                    }
                    if (!found) {
                        var opt = document.createElement('option');
                        opt.text = v;
                        sels[si].insertBefore(opt, sels[si].querySelector('[value="__custom"]'));
                    }
                    sels[si].value = v;
                }
            }
        }, 50);
        return;
    }
    _pmItems[idx][field] = val;
}

// 弹窗管理各区域的分类
function manageCats() {
    var areas = ['厨房', '吧台', '外场'];
    var h = '<h3>管理分类</h3>';
    h += '<div class="hrow" style="margin-bottom:10px"><label>选择区域</label>';
    h += '<select class="inp" id="macArea" style="max-width:120px" onchange="renderAreaCatsList()">';
    areas.forEach(function(a) { h += '<option>' + a + '</option>'; });
    h += '</select></div>';
    h += '<div class="hrow" style="margin-bottom:10px">';

    h += '<button class="btn p" onclick="addAreaCat()">添加</button></div>';
    h += '<div id="macList"></div>';
    h += '<div class="brow" style="margin-top:12px;justify-content:flex-end"><button class="btn" onclick="closeModal()">关闭</button></div>';
    showModal(h, 500);

}

// 渲染当前区域的分类列表
function renderAreaCatsList() {
    var area = $id('macArea').value;
    var cats = DB.areaCats[area] || [];
    var h = '';
    if (!cats.length) {
        h += '<div style="text-align:center;padding:20px;color:var(--tx-m)">该区域暂无分类</div>';
    } else {
        h += '<div class="tw"><table><tr><th>分类名称</th><th>使用次数</th><th>操作</th></tr>';
        cats.forEach(function(cat) {
            var count = 0;
            DB.purchases.forEach(function(p) {
                p.items.forEach(function(i) {
                    if ((i.section || '') === area && i.category === cat) count++;
                });
            });
            h += '<tr><td>' + cat + '</td><td class="nr">' + count + '</td>';
            h += '<td><button class="btn s d" onclick="delAreaCat(' + sq(cat) + ')">删除</button></td></tr>';
        });
        h += '</table></div>';
    }
    $id('macList').innerHTML = h;
}

// 添加新分类到指定区域
function addAreaCat() {
    var area = $id('macArea').value;
    var name = $id('newAreaCat').value.trim();
    if (!name) { toast('输入分类名称'); return; }
    if (!DB.areaCats[area]) DB.areaCats[area] = [];
    if (DB.areaCats[area].indexOf(name) >= 0) { toast('该区域已有此分类'); return; }
    DB.areaCats[area].push(name);
    saveDB(DB);
    sbScheduleSave;
    $id('newAreaCat').value = '';
    toast('已添加 ' + name);
    renderAreaCatsList();
}

// 删除指定区域的分类（同时清空采购记录中的该分类）
function delAreaCat(name) {
    var area = $id('macArea').value;
    if (!confirm('彻底删除"' + area + '"下的"' + name + '"？\n已使用该分类的采购记录中的分类会被清空')) return;
    DB.areaCats[area] = (DB.areaCats[area] || []).filter(function(c) { return c !== name; });
    DB.purchases.forEach(function(p) {
        p.items.forEach(function(i) {
            if ((i.section || '') === area && i.category === name) i.category = '';
        });
    });
    saveDB(DB);
    sbScheduleSave;
    toast('已删除');
    renderAreaCatsList();
}

// ------ 识别结果确认弹窗 ------

// 批量填充识别结果的区域或分类（强制覆盖全部行）
// 通用函数，同时支持粘贴解析和AI识别
function batchFill(field, source) {
    var r = source === 'parse' ? window._parseResult : window._mimoResult;
    if (!r) return;

    var prefix = source === 'parse' ? 'parse' : 'mimo';
    var selId = field === 'section' ? prefix + 'BatchSec' : prefix + 'BatchCat';
    var sel = document.getElementById(selId);
    var val = sel.value;

    if (val === '__custom') {
        var inpId = selId + 'C';
        var inp = document.getElementById(inpId);
        val = inp ? inp.value.trim() : '';
        if (!val) { toast('请输入自定义值'); return; }
    }
    if (!val) return;

    var rows = document.getElementById('parseTbl').querySelectorAll('tr');
    r.items.forEach(function(item, idx) {
        item[field] = val;

        var row = rows[idx + 1];
        if (!row) return;
        var sels = row.querySelectorAll('select');
        var si = field === 'section' ? 0 : 1;
        var targetSel = sels[si];
        if (!targetSel) return;

        var found = false;
        for (var i = 0; i < targetSel.options.length; i++) {
            if (targetSel.options[i].value === val) { found = true; break; }
        }
        if (!found) {
            var opt = document.createElement('option');
            opt.value = opt.text = val;
            targetSel.insertBefore(opt, targetSel.querySelector('[value="__custom"]'));
        }
        targetSel.value = val;
    });

    toast('已填充 ' + r.items.length + ' 项');
}

// 兼容旧调用
function parseBatchFill(field) { batchFill(field, 'parse'); }
function mimoBatchFill(field) { batchFill(field, 'mimo'); }

// 修改识别结果中单个物品的字段（支持 __clear / __custom）
function parseResFieldChange(idx, field, val) {
    var r = window._parseResult;
    if (!r || !r.items[idx]) return;

    var tbl = $id('parseTbl');
    if (!tbl) return;
    var rows = tbl.querySelectorAll('tr');
    var row = rows[idx + 1];
    if (!row) return;
    var sels = row.querySelectorAll('select');
    var si = field === 'section' ? 0 : 1;
    var sel = sels[si];
    if (!sel) return;

    if (val === '__clear') { r.items[idx][field] = ''; rebuildSel(sel, field, ''); return; }
    if (val === '__custom') {
        var prev = r.items[idx][field] || '';
        rebuildSel(sel, field, prev);
        setTimeout(function() {
            var v = prompt('输入' + (field === 'section' ? '区域' : '分类'));
            if (!v || !v.trim()) return;
            r.items[idx][field] = v.trim();
            rebuildSel(sel, field, v.trim());
        }, 50);
        return;
    }
    r.items[idx][field] = val;
}

// 确认AI识别结果并导入手动录入表单
function doMimoConfirm() {
    var r = window._mimoResult;
    if (!r) return;
    var src = $id('pResSrc').value || '岸香贸易';
    r.items.forEach(function(item) { item.source = src; });

    closeModal();

}

// 保存采购单：判断是新建还是编辑
function saveMPur() {
    if (!_pmItems.length) { toast('无物品'); return; }

    var savedItems = JSON.parse(JSON.stringify(_pmItems));
    var savedDate = $id('pmDate').value || td();
    var savedSrc = $id('pmSrc').value || '外购';

    if (_editPurId) {
        upd(function(db) {
            var idx = db.purchases.findIndex(function(p) { return p.id == _editPurId; });
            if (idx >= 0) {
                db.purchases[idx].items = savedItems;
                db.purchases[idx].date = savedDate;
                db.purchases[idx].source = savedSrc;
            }
        });
        toast('已更新');
        _editPurId = null;
    } else {
        upd(function(db) {
            db.purchases.push({ id: 'p_' + Date.now(), date: savedDate, source: savedSrc, items: savedItems });
        });
        toast('已保存');
    }

    _pmItems = [];
    checkPurInvLink(savedItems, savedDate);
}

// ------ 采购入库联动 ------

// 保存后检查采购物品是否匹配库存，弹窗让用户确认入库
function checkPurInvLink(purItems, date) {
    var matches = [];

    purItems.forEach(function(pi) {
        var name = pi.name.trim();
        function matchList(list, type) {
            list.forEach(function(item) {
                if (item.name === name || name.indexOf(item.name) >= 0 || item.name.indexOf(name) >= 0) {
                    matches.push({ type: type, inv: item, pur: pi });
                }
            });
        }
        matchList(DB.teaItems, 'tea');
        matchList(DB.cigItems, 'cig');
        matchList(DB.alcItems, 'alc');
        matchList(DB.whItems, 'wh');
    });

    if (!matches.length) { rPurchase(); return; }

    // 去重
    var seen = {};
    var uniq = matches.filter(function(m) {
        var key = m.type + '_' + m.inv.id + m.pur.name;
        if (seen[key]) return false;
        seen[key] = true;
        return true;
    });

    var labels = { tea: '🍵茗茶', cig: '🚬香烟', alc: '🍺酒类', wh: '📦仓库' };
    var h = '<h3>采购入库联动</h3>';
    h += '<p style="font-size:.78rem;color:var(--tx-s);margin-bottom:10px">以下采购物品匹配到库存，可修改入库数量：</p>';

    uniq.forEach(function(m, idx) {
        var unit = { tea: '克', cig: '包', alc: '瓶', wh: m.inv.unit || '' }[m.type];
        var stockQty = m.pur.qty;

        // 单位换算
        if (m.type === 'tea' && m.inv.calcMode === 'pack') {
            unit = '包';
            if (m.pur.unit === '斤') stockQty = Math.round(m.pur.qty * 500 / (m.inv.gramsPerPack || 250));
        } else if (m.type === 'tea') {
            if (m.pur.unit === '斤') stockQty = m.pur.qty * 500;
        } else if (m.type === 'cig') {
            if (m.pur.unit === '条') stockQty = m.pur.qty * (m.inv.purchaseConvRatio || 10);
        } else if (m.type === 'alc') {
            if (m.pur.unit === '箱') stockQty = m.pur.qty * (m.inv.purchaseConvRatio || 12);
        }
        stockQty = Math.round(stockQty * 100) / 100;

        h += '<div class="item-card" style="flex-wrap:wrap;gap:6px">';
        h += '<div style="display:flex;align-items:center;gap:6px;flex:1;min-width:200px">';
        h += '<input type="checkbox" id="plink_' + idx + '" checked style="transform:scale(1.3)">';
        h += '<span class="badge">' + labels[m.type] + '</span> <b>' + m.inv.name + '</b></div>';
        h += '<div style="display:flex;align-items:center;gap:6px">';
        h += '<span style="font-size:.72rem;color:var(--tx-m)">' + m.pur.qty + (m.pur.unit || '') + '</span>';
        h += '<span style="font-size:.72rem;color:var(--ac)">→</span>';
        h += '<input class="inp" id="plink_qty_' + idx + '" type="number" step="any" style="width:80px;padding:4px 6px;font-size:.82rem" value="' + stockQty + '">';
        h += '<span style="font-size:.78rem">' + unit + '</span>';
        h += '</div></div>';
    });

    h += '<div class="brow" style="margin-top:14px;justify-content:flex-end;gap:10px">';
    h += '<button class="btn p" onclick="doPurInvLink()">确认入库</button>';
    h += '<button class="btn" onclick="closeModal();rPurchase()">跳过</button></div>';

    showModal(h);
    window._purLinkUniq = uniq;
    window._purLinkDate = date;
}

// 执行采购入库
function doPurInvLink() {
    var uniq = window._purLinkUniq;
    var date = window._purLinkDate;
    if (!uniq) return;
    var count = 0;

    uniq.forEach(function(m, idx) {
        var cb = $id('plink_' + idx);
        if (!cb || !cb.checked) return;

        var qtyInput = $id('plink_qty_' + idx);
        var stockQty = qtyInput ? parseFloat(qtyInput.value) || 0 : m.pur.qty;
        if (stockQty <= 0) return;
        stockQty = Math.round(stockQty * 100) / 100;

        if (m.type === 'wh') {
            upd(function(db) {
                var it = db.whItems.find(function(i) { return i.id === m.inv.id; });
                if (!it) return;
                if (!it.movements) it.movements = [];
                it.movements.push({ date: date, qty: stockQty, reason: '采购入库' });
                it.stock = Math.max(0, it.stock + stockQty);
            });
        } else {
            upd(function(db) {
                var it = db[INV[m.type].key].find(function(i) { return i.id === m.inv.id; });
                if (it) it.purchases.push({ date: date, qty: stockQty, source: '采购入库', cost: m.pur.unitPrice || 0 });
            });
        }
        count++;
    });

    closeModal();
    toast(count > 0 ? '已入库 ' + count + ' 项' : '未入库');
    rPurchase();
}

// 弹窗编辑采购明细中的单个物品
function editPurByDate(date, name) {
    var purchases = DB.purchases.filter(function(pp) { return pp.date === date; });
    if (!purchases.length) return;
    var found = null, foundP = null;
    for (var i = 0; i < purchases.length; i++) {
        for (var k = 0; k < purchases[i].items.length; k++) {
            if (purchases[i].items[k].name === name) {
                found = purchases[i].items[k];
                foundP = purchases[i];
                break;
            }
        }
        if (found) break;
    }
    if (!found) return;

    var secs = ['厨房', '吧台', '外场'];
    var cats = getPurCats(found.section);

    var h = '<h3>编辑物品</h3>';
    h += '<div class="hrow"><label>日期</label><input class="inp" id="epi_date" type="text" readonly placeholder="选择日期" value="' + foundP.date + '" onclick="_dpOpen(\'epi_date\')" style="max-width:160px;cursor:pointer"></div>';
    h += '<div class="hrow"><label>品名</label><input class="inp" id="epi_name" style="flex:2" value="' + found.name.replace(/"/g, '&quot;') + '"></div>';
    h += '<div class="hrow"><label>区域</label><select class="inp" id="epi_sec" style="max-width:110px" onchange="epiSecChanged(this)">';
    h += '<option value="">-</option>';
    secs.forEach(function(s) { h += '<option' + (found.section === s ? ' selected' : '') + '>' + s + '</option>'; });
    h += '</select><label>分类</label><select class="inp" id="epi_cat" style="max-width:130px">';
    h += '<option value="">-</option>';
    cats.forEach(function(c) { h += '<option' + (found.category === c ? ' selected' : '') + '>' + c + '</option>'; });
    h += '</select></div>';
    h += '<div class="hrow">';
    h += '<label>数量</label><input class="inp" id="epi_qty" type="number" step="any" style="max-width:80px" value="' + found.qty + '">';
    h += '<label>单位</label><input class="inp" id="epi_unit" style="max-width:60px" value="' + (found.unit || '') + '">';
    h += '<label>单价</label><input class="inp" id="epi_up" type="number" step="0.01" style="max-width:90px" value="' + (found.unitPrice || 0) + '" oninput="epiCalcTotal()">';
    h += '<label>总价</label><input class="inp" id="epi_total" type="number" step="0.01" style="max-width:100px" value="' + found.total + '">';
    h += '</div>';
    h += '<div class="brow" style="margin-top:14px;justify-content:flex-end">';
    h += '<button class="btn p" onclick="doEditPurItem(' + sq(date) + ',' + sq(name) + ')">保存</button>';
    h += '<button class="btn" onclick="closeModal();setTimeout(function(){showPurDayModal(\'' + date + '\')},100)">返回</button></div>';
    showModal(h, 550);
}

// 编辑弹窗：自动计算总价
function epiCalcTotal() {
    var q = parseFloat($id('epi_qty').value) || 0;
    var u = parseFloat($id('epi_up').value) || 0;
    if (q > 0) $id('epi_total').value = Math.round(q * u * 100) / 100;

// 保存编辑的物品
function doEditPurItem(date, origName) {
    var newDate = $id('epi_date').value;
    upd(function(db) {
        db.purchases.forEach(function(p) {
            if (p.date !== date) return;
            for (var k = 0; k < p.items.length; k++) {
                var item = p.items[k];
                if (item.name !== origName) continue;
                item.name = $id('epi_name').value.trim() || item.name;
                item.section = $id('epi_sec').value;
                item.category = $id('epi_cat').value;
                item.qty = parseFloat($id('epi_qty').value) || 0;
                item.unit = $id('epi_unit').value.trim();
                item.unitPrice = parseFloat($id('epi_up').value) || 0;
                item.total = parseFloat($id('epi_total').value) || 0;
                break;
            }
            if (newDate && newDate !== date) p.date = newDate;
        });
    });
    var showDate = (newDate && newDate !== date) ? newDate : date;
    closeModal();
    toast('已更新');
    setTimeout(function() { showPurDayModal(showDate); }, 100);
}

// ------ 采购明细日历 ------

// 明细日历视图
function renderPHist() {
    var el = $id('pHistArea');
    if (!el) return;
    var ym = $id('pHistM') ? $id('pHistM').value : curYM();
    if (!ym) ym = curYM();

    var year = parseInt(ym.split('-')[0]);
    var month = parseInt(ym.split('-')[1]);
    var daysInMonth = new Date(year, month, 0).getDate();
    var firstDay = new Date(year, month - 1, 1).getDay();
    firstDay = firstDay === 0 ? 6 : firstDay - 1;
    var todayStr = td();
    var todayDay = parseInt(todayStr.split('-')[2]);
    var isThisMonth = todayStr.startsWith(ym);

    var dayTotals = {}, grandTotal = 0, srcTotals = {};
    DB.purchases.filter(function(p) { return p.date.startsWith(ym); }).forEach(function(p) {
        p.items.forEach(function(item) {
            var day = parseInt(p.date.substring(8, 10));
            if (!dayTotals[day]) dayTotals[day] = 0;
            dayTotals[day] += item.total;
            grandTotal += item.total;
            var src = item.source || p.source || '外购';
            if (!srcTotals[src]) srcTotals[src] = 0;
            srcTotals[src] += item.total;
        });
    });

    var h = '';
    if (grandTotal > 0) {
        h += '<div class="cards">';
        h += '<div class="card"><div class="card-l">本月采购</div><div class="card-v ac">' + fmtC(grandTotal) + '</div></div>';
        h += '<div class="card"><div class="card-l">天数</div><div class="card-v">' + Object.keys(dayTotals).length + '</div></div>';
        h += '<div class="card"><div class="card-l">日均</div><div class="card-v">' + fmtC(grandTotal / daysInMonth) + '</div></div>';
        h += '</div>';
        h += '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px">';
        Object.keys(srcTotals).forEach(function(src) { h += '<span class="badge">' + src + ' ' + fmtC(srcTotals[src]) + '</span>'; });
        h += '</div>';
    }

    h += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">';
    ['一','二','三','四','五','六','日'].forEach(function(w) { h += '<div style="text-align:center;font-size:.7rem;color:var(--tx-m);padding:4px 0">' + w + '</div>'; });
    for (var ix = 0; ix < firstDay; ix++) h += '<div></div>';
    for (var d = 1; d <= daysInMonth; d++) {
        var dateStr = ym + '-' + (d < 10 ? '0' + d : d);
        var has = !!dayTotals[d], isToday = isThisMonth && d === todayDay;
        var bg = has ? 'var(--card)' : 'var(--card-h)';
        var border = isToday ? '2px solid var(--ac)' : '1px solid var(--bd)';
        h += '<div style="background:' + bg + ';border:' + border + ';border-radius:6px;padding:5px 4px;min-height:52px;cursor:' + (has ? 'pointer' : 'default') + '"';
        if (has) h += ' onclick="showPurDayModal(\'' + dateStr + '\')"';
        h += '><div style="font-size:.7rem;font-weight:600;color:' + (isToday ? 'var(--ac)' : 'var(--tx)') + '">' + d + '</div>';
        if (has) {
            h += '<div style="font-family:var(--fm);font-size:.65rem;color:var(--ac);margin-top:2px">';
            h += fmtC(dayTotals[d]);
            h += '</div>';
        }
        h += '</div>';
    }
    h += '</div>';

// 查看某天采购详情
function showPurDayModal(date) {

    dayPurchases.forEach(function(p) {
        p.items.forEach(function(item) {
            allItems.push({
                name: item.name, section: item.section || '未分区', category: item.category || '未分类',
                source: item.source || p.source || '外购', qty: item.qty || 0, unit: item.unit || '',
                unitPrice: item.unitPrice || 0, total: item.total || 0
            });
        });
    });

    var total = allItems.reduce(function(s, item) { return s + item.total; }, 0);
    var dateLabel = date.substring(5).replace('-', '/');

    var h = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">';
    h += '<div style="display:flex;align-items:center;gap:6px">';

    h += '<button class="btn s d" onclick="delPurDay(\'' + date + '\')">删除当日</button></div></div>';

    // 按区域→分类分组
    var secGroups = {};
    allItems.forEach(function(item) {
        if (!secGroups[item.section]) secGroups[item.section] = {};
        if (!secGroups[item.section][item.category]) secGroups[item.section][item.category] = { items: [], total: 0 };
        secGroups[item.section][item.category].items.push(item);
        secGroups[item.section][item.category].total += item.total;
    });

    var secTotals = {};
    Object.keys(secGroups).forEach(function(sec) {
        secTotals[sec] = 0;
        Object.keys(secGroups[sec]).forEach(function(cat) { secTotals[sec] += secGroups[sec][cat].total; });

    var secKeys = Object.keys(secGroups).sort(function(a, b) { return secTotals[b] - secTotals[a]; });

        h += '<span style="font-size:.88rem;font-weight:700;color:var(--ac)">▸ ' + sec + '</span>';
        h += '<div style="display:flex;align-items:center;gap:6px">';
        h += '<span style="font-family:var(--fm);font-size:.88rem;font-weight:600">¥' + fmtC(secTotals[sec]) + '</span>';
        h += '<button class="btn s d" style="font-size:.65rem;padding:2px 6px" onclick="event.stopPropagation();delPurSec(\'' + date + '\',\'' + sec.replace(/'/g, "\\'") + '\')">删除区域</button>';
        h += '</div></div>';

        h += '<div id="' + secId + '">';
        var catKeys = Object.keys(secGroups[sec]).sort(function(a, b) { return secGroups[sec][b].total - secGroups[sec][a].total; });

        var ci = 0;
        catKeys.forEach(function(cat) {
            ci++;
            var group = secGroups[sec][cat];
            var catId = secId + 'cat' + ci;

            h += '<div style="margin-left:10px;margin-bottom:8px">';
            h += '<div style="display:flex;justify-content:space-between;align-items:center;padding:3px 0;margin-bottom:4px;cursor:pointer" onclick="toggleSec(\'' + catId + '\')">';
            h += '<span style="font-size:.75rem;font-weight:600;color:var(--tx)">▸' + cat + '</span>';
            h += '<div style="display:flex;align-items:center;gap:4px">';
            h += '<span style="font-family:var(--fm);font-size:.75rem;color:var(--tx-m)">¥' + fmtC(group.total) + '</span>';
            h += '<button class="btn s d" style="font-size:.6rem;padding:1px 5px" onclick="event.stopPropagation();delPurCat(\'' + date + '\',\'' + sec.replace(/'/g, "\\'") + '\',\'' + cat.replace(/'/g, "\\'") + '\')">删除分类</button>';
            h += '</div></div>';

            h += '<div id="' + catId + '">';
            group.items.forEach(function(item) {
                h += '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 10px;margin-bottom:3px;background:var(--card-h);border:1px solid var(--bd-l);border-radius:6px">';
                h += '<div style="flex:1;min-width:0">';

                h += '<div style="font-size:.65rem;color:var(--tx-s)">' + item.qty + (item.unit || '') + ' × ¥' + fmt(item.unitPrice) + '</div>';
                h += '</div>';
                h += '<div style="display:flex;align-items:center;gap:4px;flex-shrink:0;margin-left:6px">';

                h += '</div></div>';
            });
            h += '</div></div>';
        });
        h += '</div></div>';
    });

    h += '</div>';
    h += '<div class="brow" style="margin-top:12px;justify-content:flex-end"><button class="btn" onclick="closeModal()">关闭</button></div>';

    showModal(h, 600);
    var mc = document.querySelector('.modal-content');
    if (mc) { mc.style.height = '75vh'; mc.style.display = 'flex'; mc.style.flexDirection = 'column'; }
    var sb = mc ? mc.querySelector('[style*="max-height"]') : null;
    if (sb) { sb.style.flex = '1'; sb.style.overflowY = 'auto'; sb.style.minHeight = '0'; }
}

function delPurDay(date) {

// 删除某天某区域
function delPurSec(date, sec) {

    upd(function(db) {
        db.purchases.forEach(function(p) {

function delPurCat(date, sec, cat) {

    var p = DB.purchases.find(function(pp) { return pp.date === date; });
    if (!p) return;

    // 找到原物品
    var orig = null;
    for (var i = 0; i < p.items.length; i++) {
        if (p.items[i].name === name && p.items[i].source !== '退货') {

    var h = '<h3>退货 · ' + name + '</h3>';

    h += '<div class="pv-row"><span class="k">数量</span><span>' + orig.qty + (orig.unit || '') + '</span></div>';
    h += '<div class="pv-row"><span class="k">单价</span><span>' + fmtC(orig.unitPrice || 0) + '</span></div>';

// 执行退货：在退货日期新增一条负数记录
function doReturnPurItem(date, name) {
    var retDate = $id('retDate').value || td();
    var retQty = parseFloat($id('retQty').value) || 0;
    var retTotal = parseFloat($id('retTotal').value) || 0;
    var retReason = $id('retReason').value.trim();

    if (retQty <= 0 && retTotal <= 0) { toast('请填写退货信息'); return; }

    // 找到原物品信息
    var p = DB.purchases.find(function(pp) { return pp.date === date; });
    if (!p) return;
    var orig = null;
    for (var i = 0; i < p.items.length; i++) {
        if (p.items[i].name === name && p.items[i].source !== '退货') {
            orig = p.items[i];
            break;
        }
    }
    if (!orig) { toast('未找到原采购'); return; }

    // 查找退货日期对应的采购记录，没有就新建
    upd(function(db) {
        var target = db.purchases.find(function(pp) { return pp.date === retDate; });
        if (!target) {
            target = { date: retDate, source: p.source, items: [] };
            db.purchases.push(target);
        }

        // 添加退货记录（负数金额）
        target.items.push({
            name: name,
            section: orig.section,
            category: orig.category,
            qty: -retQty,
            unit: orig.unit || '',
            unitPrice: orig.unitPrice || 0,
            total: -retTotal,
            source: '退货',
            note: retReason
        });
    });

    closeModal();
    toast('已退货 ' + name + ' ¥' + fmtC(retTotal));

    // 返回原弹窗
    setTimeout(function() { showPurDayModal(date); }, 100);
}

var _expCalYM=curYM(); // 当前显示的年月
// 渲染费用日历视图
function renderExpCalendar(){
    var ym=_expCalYM;
    var year=parseInt(ym.split('-')[0]);
    var month=parseInt(ym.split('-')[1]);

    var monthItems=DB.expenses.filter(function(e){return e.date.startsWith(ym)});
    var monthTotal=monthItems.reduce(function(s,e){return s+e.amount},0);

    var dayData={};
    monthItems.forEach(function(e){
        var day=parseInt(e.date.substring(8,10));
        if(!dayData[day])dayData[day]=0;
        dayData[day]+=e.amount;
    });

    var catTotals={};
    monthItems.forEach(function(e){
        if(!catTotals[e.category])catTotals[e.category]=0;
        catTotals[e.category]+=e.amount;
    });

    var todayDay=parseInt(td().split('-')[2]);
    var isThisMonth=td().startsWith(ym);

    var h='';

    // 月份切换
    h+='<div class="hrow" style="margin-bottom:10px">';
    h+='<button class="btn s" onclick="expCalNav(-1)">◀ 上月</button>';
    h+='<span style="font-size:.88rem;font-weight:700;flex:1;text-align:center">'+year+'年'+month+'月</span>';
    h+='<button class="btn s" onclick="expCalNav(1)">下月 ▶</button></div>';

    // 日历网格（和日报一样的样式）
    var firstDay=new Date(year,month-1,1).getDay();
    firstDay=firstDay===0?6:firstDay-1;
    var daysInMonth=new Date(year,month,0).getDate();

    h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px">';
    ['一','二','三','四','五','六','日'].forEach(function(w){
        h+='<div style="text-align:center;font-size:.7rem;color:var(--tx-m);padding:4px 0">'+w+'</div>';
    });

    for(var i=0;i<firstDay;i++)h+='<div></div>';

    for(var d=1;d<=daysInMonth;d++){
        var dateStr=ym+'-'+(d<10?'0'+d:d);
        var isToday=isThisMonth&&d===todayDay;
        var has=!!dayData[d];

        h+='<div style="background:'+(has?'var(--card)':'var(--card-h)')+';border:1px solid '+(isToday?'var(--ac)':'var(--bd)')+';border-radius:6px;padding:6px;cursor:'+(has?'pointer':'default')+';min-height:65px"';

        if(has)h+=' onclick="expDayClick(\''+dateStr+'\')"';

        h+='><div style="font-size:.72rem;font-weight:600;color:'+(isToday?'var(--ac)':'var(--tx)')+'">'+d+'</div>';

        if(has){
            h+='<div style="font-family:var(--fm);font-size:.7rem;color:var(--ac);margin-top:2px">¥'+fmtC(dayData[d])+'</div>';
        }else{
            h+='<div style="font-size:.6rem;color:var(--tx-m);margin-top:4px">-</div>';
        }
        h+='</div>';
    }
    h+='</div>';

    // 底部：本月汇总（和日报一样用cards）
    if(monthItems.length){
        h+='<div class="cards">';
        h+='<div class="card"><div class="card-l">本月费用</div><div class="card-v ac">'+fmtC(monthTotal)+'</div></div>';
        h+='<div class="card"><div class="card-l">笔数</div><div class="card-v">'+monthItems.length+'</div></div>';
        h+='<div class="card"><div class="card-l">日均</div><div class="card-v">'+fmtC(monthTotal/daysInMonth)+'</div></div>';
        h+='</div>';

        // 分类标签
        h+='<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:10px">';
        Object.keys(catTotals).sort(function(a,b){return catTotals[b]-catTotals[a]}).forEach(function(cat){
            h+='<span class="badge">'+cat+' '+fmtC(catTotals[cat])+'</span>';
        });
        h+='</div>';
    }else{
        h+='<div style="text-align:center;padding:20px;color:var(--tx-m);font-size:.78rem">本月暂无费用记录</div>';
    }

    return h;
}

// 库存主页：顶部统计卡片 + 标签栏（库存/明细）+ 库存表格
function rInv(type) {
    var items = DB[INV[type].key] || [];
    var ym = curYM();
    var unit = type === 'cig' ? '包' : type === 'alc' ? '瓶' : '';

    // 统计每个商品的本月数据
    var stats = [];
    items.forEach(function(item) {
        var sales = item.sales.filter(function(s) { return s.date.startsWith(ym); });
        var c = invCalc(item, type);
        var mc = invCalcMon(item, type, ym);
        var cups = 0, pots = 0, qty = 0, expected = 0;
        sales.forEach(function(s) {
            cups += (s.cups || 0); pots += (s.pots || 0); qty += (s.qty || 0);
            if (type === 'tea') expected += (s.cups || 0) * (item.pricePerCup || 0) + (s.pots || 0) * (item.pricePerPot || 0);
            else expected += (s.qty || 0) * (item.pricePerUnit || 0);
        });
        var fifo = calcFIFOMonthlyCost(item, type, ym);
        stats.push({
            item: item,
            stock: fifo.remainQty, 
            cups: cups,
            pots: pots,
            qty: qty,
            expected: expected,
            actual: mc.actual,
            cost: fifo.cost,
            profit: mc.actual - fifo.cost,
            fifo: fifo
        });
    });

    // 汇总
    var tE = stats.reduce(function(s, st) { return s + st.expected; }, 0);
    var tA = stats.reduce(function(s, st) { return s + st.actual; }, 0);
    var tC = stats.reduce(function(s, st) { return s + st.cost; }, 0);

                h += '<td class="nr">' + margin + '</td>';
                h += '<td><button class="btn s" data-act="edit">编</button> ';
                h += '<button class="btn s" onclick="invDetail(\'' + type + '\',\'' + st.item.id + '\')">详</button> ';
                h += '<button class="btn s d" data-act="del">×</button></td></tr>';

    var dayTotals = {};

        item.sales.forEach(function(s) {
            if (!s.date || !s.date.startsWith(ym)) return;
            var day = parseInt(s.date.substring(8, 10));
            if (!dayTotals[day]) dayTotals[day] = 0;
            dayTotals[day] += s.amount || 0;
        });
    });

    var monthTotal = Object.values(dayTotals).reduce(function(s, v) { return s + v; }, 0);

    var h = '';
    h += '<div class="hrow"><label>月份</label><input class="inp" id="invHistM" type="text" readonly placeholder="选择月份" value="' + ym + '" onclick="_mpOpen(\'invHistM\')" onchange="renderInvHist(\'' + type + '\')" style="max-width:180px;cursor:pointer"></div>';

    // 日历网格
    h += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px">';
    ['一', '二', '三', '四', '五', '六', '日'].forEach(function(w) {
        h += '<div style="text-align:center;font-size:.7rem;color:var(--tx-m);padding:4px 0">' + w + '</div>';
    });

    for (var i = 0; i < firstDay; i++) h += '<div></div>';

    for (var d = 1; d <= daysInMonth; d++) {
        var dateStr = ym + '-' + (d < 10 ? '0' + d : d);
        var has = !!dayTotals[d];
        var isToday = isThisMonth && d === todayDay;
        var bg = has ? 'var(--card)' : 'var(--card-h)';
        var border = isToday ? '2px solid var(--ac)' : '1px solid var(--bd)';

        h += '<div style="background:' + bg + ';border:' + border + ';border-radius:6px;padding:5px 4px;min-height:52px;cursor:' + (has ? 'pointer' : 'default') + '"';
        if (has) h += ' onclick="showInvDayModal(\'' + type + '\',\'' + dateStr + '\')"';
        h += '><div style="font-size:.7rem;font-weight:600;color:' + (isToday ? 'var(--ac)' : 'var(--tx)') + '">' + d + '</div>';
        if (has) {
            h += '<div style="font-family:var(--fm);font-size:.65rem;color:var(--ac);margin-top:2px">';
            if (dayTotals[d] >= 10000) h += (dayTotals[d] / 10000).toFixed(1) + '万';
            else if (dayTotals[d] >= 1000) h += (dayTotals[d] / 1000).toFixed(1) + 'k';
            else h += '¥' + dayTotals[d].toFixed(0);
            h += '</div>';
        }
        h += '</div>';
    }
    h += '</div>';

    if (!monthTotal) h += '<div style="text-align:center;padding:20px;color:var(--tx-m);font-size:.78rem">本月暂无销售记录</div>';
    el.innerHTML = h;
}

function delInvSaleConfirm(type, itemId, si, date) {

// 保存编辑后的销售记录
function saveEditInvSale(type, itemId, si) {
    var item = DB[INV[type].key].find(function(i) { return i.id === itemId; });
    if (!item || !item.sales[si]) return;

    var oldDate = item.sales[si].date;
    var newDate = $id('esi_date').value;
    item.sales[si].date = newDate;

    if (type === 'tea') {
        item.sales[si].cups = parseInt($id('esi_cups').value) || 0;

        item.sales[si].qty = parseFloat($id('esi_qty').value) || 0;
    }

    item.sales[si].amount = parseFloat($id('esi_amount').value) || 0;
    saveDB();
    syncInvToDaily(type, oldDate);
    if (oldDate !== newDate) syncInvToDaily(type, newDate);

    toast('已保存');

    // ★ 先刷新库存页面，再打开明细弹窗
    closeModal();
    rInv(type);
    setTimeout(function() { showInvDayModal(type, newDate); }, 150);
}

// 构建进销存记录列表（销售+出入库按日期排序）
function buildRecords(item, type, ym) {
    var allRecords = [];

    // 查找对应日期的手动出库备注
    var manualNotes = {};
    (item.purchases || []).forEach(function(p) {
        if (p.qty < 0 && p.source !== '日报' && p.date.startsWith(ym)) {
            manualNotes[p.date] = p.reason || p.source || '手动';
        }
    });

    // 销售记录
    item.sales.forEach(function(s, idx) {
        if (!s.date.startsWith(ym)) return;
        var expected = 0;
        if (type === 'tea') {
            expected = (s.cups || 0) * (item.pricePerCup || 0) + (s.pots || 0) * (item.pricePerPot || 0);
        } else {
            expected = (s.qty || 0) * (item.pricePerUnit || 0);
        }
        var source = manualNotes[s.date] || '日报';
        allRecords.push({ date: s.date, kind: 'sale', idx: idx, data: s, source: source, expected: expected, actual: s.amount || 0 });
    });

    // 出入库记录（入库 + 无sales对应的手动出库）
    var saleDates = {};
    item.sales.forEach(function(s) { if (s.date.startsWith(ym)) saleDates[s.date] = true; });

    (item.purchases || []).forEach(function(m, idx) {
        if (!m.date.startsWith(ym)) return;
        if (m.source === '日报') return;
        if (m.qty >= 0) {
            allRecords.push({ date: m.date, kind: 'move', idx: idx, data: m, source: m.source || '', expected: 0, actual: m.cost || 0 });
        } else if (!saleDates[m.date]) {
            allRecords.push({ date: m.date, kind: 'sale', idx: idx, data: { qty: Math.abs(m.qty), amount: 0 }, source: m.reason || m.source || '手动', expected: 0, actual: 0 });
        }
    });

    allRecords.sort(function(a, b) { return a.date.localeCompare(b.date); });
    return allRecords;
}

// 渲染出入库明细表格（入库/出库/销售混合）
function renderBuyDetail(item, type, ym, unit) {
    var h = '<div class="hrow"><label>月份</label><input class="inp" id="detBuyM" type="text" readonly placeholder="选择月份" value="' + ym + '" onclick="_mpOpen(\'detBuyM\')" onchange="detBuyRefresh(\'' + type + '\',\'' + item.id + '\')" style="max-width:180px;cursor:pointer"></div>';

    var moves = [];
    try { moves = (item.purchases || []).filter(function(p) { return p.date && p.date.startsWith(ym); }); } catch (e) {}
    var sales = [];
    try { sales = (item.sales || []).filter(function(s) { return s.date && s.date.startsWith(ym); }); } catch (e) {}

    // 统一单位
    var u = unit;
    if (type === 'tea' && item.calcMode === 'pack') u = '包';
    else if (type === 'tea') u = '克';

    // 合并出入库+销售记录
    var allRows = [];
    moves.forEach(function(m) {
        allRows.push({ date: m.date, type: m.qty >= 0 ? '入库' : '出库', qty: Math.abs(m.qty), reason: m.source || '-', cost: m.cost || 0, amount: 0, rowType: 'move', ref: item.purchases.indexOf(m) });
    });
    sales.forEach(function(s) {
        var qty = 0, exp = 0;
        if (type === 'tea') {
            var cups = s.cups || 0, pots = s.pots || 0;
            var mode = item.calcMode || 'gram';
            if (mode === 'pack') qty = Math.round((cups * (item.packsPerCup || 1) + pots * (item.packsPerPot || 2)) * 100) / 100;
            else qty = Math.round((cups * (item.gramsPerCup || 5) + pots * (item.gramsPerPot || 15)) * 100) / 100;
            exp = s.expectedAmount || (cups * (item.pricePerCup || 0) + pots * (item.pricePerPot || 0));
        } else {
            qty = s.qty || 0;
            exp = qty * (item.pricePerUnit || 0);
        }
        allRows.push({ date: s.date, type: '销售', qty: qty, reason: '销售', cost: 0, expected: exp, amount: s.amount || 0, rowType: 'sale', ref: item.sales.indexOf(s) });
    });

    }

    var totalIn = 0, totalOut = 0, totalSale = 0, totalExp = 0, totalAmt = 0;

    allRows.forEach(function(r) {
        var color = r.type === '入库' ? 'gn' : r.type === '销售' ? 'og' : 'rd';

        h += '<td style="font-size:.72rem">' + r.reason + '</td>';

        h += '<button class="btn s d" onclick="delInvRow(\'' + type + '\',\'' + item.id + '\',\'' + r.rowType + '\',' + r.ref + ')">×</button></td></tr>';

        if (r.type === '入库') totalIn += r.qty;
        else if (r.type === '出库') totalOut += r.qty;
        else if (r.type === '销售') { totalSale += r.qty; totalExp += (r.expected || 0); totalAmt += (r.amount || 0); }
    });

    h += '<tr style="background:var(--card-h)"><td style="font-weight:600">合计</td><td></td>';
    h += '<td class="nr" style="font-weight:600">入:' + Math.round(totalIn * 100) / 100 + ' 出:' + Math.round(totalOut * 100) / 100 + ' 销:' + Math.round(totalSale * 100) / 100 + u + '</td>';

// 编辑销售时自动计算应收金额（茗茶）
function calcEditTeaExp(itemId) {

// 保存编辑的出入库记录
function doEditInvMove(type, itemId, idx) {
    var item = DB[INV[type].key].find(function(i) { return i.id === itemId; });
    if (!item || !item.purchases[idx]) return;
    var qty = parseFloat($id('eir_qty').value) || 0;

    upd(function(db) {
        var it = db[INV[type].key].find(function(i) { return i.id === itemId; });

            it.purchases[idx].qty = qty * dir;

// 保存编辑的销售记录（同步更新日报）
function doEditInvSale(type, itemId, idx) {
    var item = DB[INV[type].key].find(function(i) { return i.id === itemId; });
    if (!item || !item.sales[idx]) return;
    var date = $id('eir_sdate').value || td();
    var expected = parseFloat($id('eir_exp').value) || 0;
    var amount = parseFloat($id('eir_samt').value) || expected;

    if (type === 'tea') {
        var cups = parseInt($id('eir_cups').value) || 0;
        var pots = parseInt($id('eir_pots').value) || 0;
        upd(function(db) {
            var it = db[INV[type].key].find(function(i) { return i.id === itemId; });
            if (!it) return;
            it.sales[idx] = { date: date, cups: cups, pots: pots, expectedAmount: expected, amount: amount };
            syncDailyTeaSales(db, date, itemId, cups, pots, amount);
        });
    } else {
        var qty = parseInt($id('eir_sqty').value) || 0;
        upd(function(db) {
            var it = db[INV[type].key].find(function(i) { return i.id === itemId; });
            if (!it) return;
            it.sales[idx] = { date: date, qty: qty, amount: amount };
            syncDailyCigSales(db, date, itemId, qty, amount);
        });
    }
    closeModal();
    toast('已更新');
    refreshDetBuy(type, itemId);
}

// 删除出入库或销售记录
function delInvRow(type, itemId, rowType, idx) {
    var item = DB[INV[type].key].find(function(i) { return i.id === itemId; });
    if (!item) return;
    if (!confirm('删除此条记录？')) return;

    if (rowType === 'move') {
        upd(function(db) {
            var it = db[INV[type].key].find(function(i) { return i.id === itemId; });
            if (it) it.purchases.splice(idx, 1);
        });
        toast('已删除');
    } else {
        var sale = item.sales[idx];
        upd(function(db) {
            var it = db[INV[type].key].find(function(i) { return i.id === itemId; });
            if (!it) return;
            it.sales.splice(idx, 1);
            if (sale) {
                var date = sale.date;
                db.dailyReports.forEach(function(dr) {
                    if (dr.date !== date) return;
                    if (type === 'tea' && dr.teaSales && dr.teaSales[itemId]) delete dr.teaSales[itemId];
                    if (type === 'cig' && dr.cigSales && dr.cigSales[itemId]) delete dr.cigSales[itemId];
                });
            }
        });
        toast('已删除');
    }
    refreshDetBuy(type, itemId);
}

// 同步香烟销售数据到日报
function syncDailyCigSales(db, date, itemId, qty, amt) {
    db.dailyReports.forEach(function(dr) {
        if (dr.date !== date) return;
        if (dr.cigSales && dr.cigSales[itemId]) {
            dr.cigSales[itemId] = { qty: qty, amount: amt };
            var total = 0;
            Object.keys(dr.cigSales).forEach(function(k) { total += dr.cigSales[k].amount || 0; });
            dr.revenue.cigarette.total = total;
        }
    });
}

// 同步茗茶销售数据到日报
function syncDailyTeaSales(db, date, itemId, cups, pots, amt) {
    db.dailyReports.forEach(function(dr) {
        if (dr.date !== date) return;
        if (dr.teaSales && dr.teaSales[itemId]) {
            dr.teaSales[itemId] = { cups: cups, pots: pots, amount: amt };
        }
    });
}

// 执行单个物品的入库或销售操作
function doInvMove(type, id, dir) {
    var date = $id('mvDate').value || td();
    var cfg = INV[type];

    if (dir > 0) {
        // 入库
        var qty = parseFloat($id('mvQty').value);
        var unit = $id('mvUnit').value;
        if (isNaN(qty) || qty <= 0) { toast('填数量'); return; }

        var stockQty = qty;
        if (type === 'tea') {
            var it = DB[cfg.key].find(function(i) { return i.id === id; });
            if (it && it.calcMode === 'pack') { stockQty = qty; }
            else { if (unit === '斤') stockQty = qty * 500; }
        } else if (type === 'cig') {
            var it = DB[cfg.key].find(function(i) { return i.id === id; });
            if (unit === '条') stockQty = qty * (it ? it.purchaseConvRatio || 10 : 10);
        } else {
            var it = DB[cfg.key].find(function(i) { return i.id === id; });
            if (unit === '箱') stockQty = qty * (it ? it.purchaseConvRatio || 12 : 12);
        }
        stockQty = Math.round(stockQty * 100) / 100;

        var entry = { date: date, qty: stockQty, source: $id('mvReason').value || '' };
        var cost = parseFloat($id('mvCost').value);
        if (cost > 0) entry.cost = cost;

        upd(function(db) {
            var it = db[cfg.key].find(function(i) { return i.id === id; });
            if (!it) return;
            it.purchases.push(entry);
        });
        closeModal();
        toast('入库 ' + qty + unit);
    } else {
        // 销售
        var reason = $id('mvReason').value || '';

        if (type === 'tea') {
            var it = DB[cfg.key].find(function(i) { return i.id === id; });
            if (!it) return;
            var cups = parseInt($id('mvCups').value) || 0;
            var pots = parseInt($id('mvPots').value) || 0;
            var expected = parseFloat($id('mvExpected').value) || 0;
            var amount = parseFloat($id('mvAmount').value) || expected;
            var mode = it.calcMode || 'gram';
            var stockUsed = 0;
            if (mode === 'pack') stockUsed = cups * (it.packsPerCup || 1) + pots * (it.packsPerPot || 2);
            else stockUsed = cups * (it.gramsPerCup || 5) + pots * (it.gramsPerPot || 15);
            stockUsed = Math.round(stockUsed * 100) / 100;

            upd(function(db) {
                var it2 = db[cfg.key].find(function(i) { return i.id === id; });
                if (!it2) return;
                it2.sales.push({ date: date, cups: cups, pots: pots, expectedAmount: expected, amount: amount });
            });

            // ★ 同步日报
            syncInvToDaily(type, date);

            closeModal();
            toast('销售 ' + cups + '杯' + pots + '壶 应收:' + expected.toFixed(2) + ' 实收:' + amount.toFixed(2));
        } else if (type === 'cig') {
            var qty = parseInt($id('mvQty').value) || 0;
            var amount = parseFloat($id('mvAmount').value) || 0;
            if (qty <= 0) { toast('填数量'); return; }
            upd(function(db) {
                var it = db[cfg.key].find(function(i) { return i.id === id; });
                if (!it) return;
                it.sales.push({ date: date, qty: qty, amount: amount });
            });

            // ★ 同步日报
            syncInvToDaily(type, date);

            closeModal();
            toast('销售 ' + qty + '包 ' + amount.toFixed(2) + '元');
        } else {
            var qty = parseInt($id('mvQty').value) || 0;
            var amount = parseFloat($id('mvAmount').value) || 0;
            if (qty <= 0) { toast('填数量'); return; }
            upd(function(db) {
                var it = db[cfg.key].find(function(i) { return i.id === id; });
                if (!it) return;
                it.sales.push({ date: date, qty: qty, amount: amount });
            });

            // ★ 同步日报
            syncInvToDaily(type, date);

            closeModal();
            toast('销售 ' + qty + '瓶 ' + amount.toFixed(2) + '元');
        }
    }
    rInv(type);
}

// 自动计算成本/克 或 成本/包
function autoCalcCost(mode) {
    if (mode === 'gram') {
        var os = parseFloat($id('ai_os_g').value) || 0;
        var ov = parseFloat($id('ai_ov_g').value) || 0;
        if (os > 0 && ov > 0) $id('ai_costPerGram').value = (Math.round(ov / os * 1000) / 1000).toFixed(3);
    } else {
        var os = parseFloat($id('ai_os_p').value) || 0;
        var ov = parseFloat($id('ai_ov_p').value) || 0;
        if (os > 0 && ov > 0) $id('ai_cpp').value = (Math.round(ov / os * 100) / 100).toFixed(2);
    }
}

// FIFO 月度销售成本（通用：茗茶/香烟/酒类）
function calcFIFOMonthlyCost(item, type, ym) {
    var queue = [];
    var unit = type === 'tea' ? '克' : type === 'cig' ? '包' : '瓶';

    // 1. 期初入队
    var openingQty = item.openingStock || 0;
    var openingUnitCost = 0;
    if (type === 'tea') {
        openingUnitCost = item.costPerGram || 0;
    } else {
        openingUnitCost = item.costPerUnit || (openingQty > 0 ? (item.openingCost || 0) / openingQty : 0);
    }
    if (openingQty > 0) {
        queue.push({ qty: openingQty, unitCost: openingUnitCost });
    }

    // 2. 按日期顺序处理所有记录（入库+销售）
    var allEvents = [];

    // 入库事件
    (item.purchases || []).forEach(function(p) {
        if (p.qty > 0) {
            var uc = p.cost ? p.cost / p.qty : openingUnitCost;
            allEvents.push({ date: p.date, type: 'in', qty: p.qty, unitCost: uc });
        }
    });

    // 销售事件
    (item.sales || []).forEach(function(s) {
        var consumeQty = 0;
        if (type === 'tea') {
            consumeQty = (s.cups || 0) * (item.gramsPerCup || 0) + (s.pots || 0) * (item.gramsPerPot || 0);
        } else {
            consumeQty = s.qty || 0;
        }
        if (consumeQty > 0) {
            allEvents.push({ date: s.date, type: 'out', qty: consumeQty, saleAmount: s.amount || 0 });
        }
    });

    // 按日期排序（同一天先入库再销售）
    allEvents.sort(function(a, b) {
        if (a.date !== b.date) return a.date.localeCompare(b.date);
        return a.type === 'in' ? -1 : 1;
    });

    // 3. 逐日处理
    var monthCost = 0, monthRevenue = 0, monthConsume = 0;

    allEvents.forEach(function(ev) {
        if (ev.type === 'in') {
            queue.push({ qty: ev.qty, unitCost: ev.unitCost });
        } else {
            // FIFO 扣减
            var remaining = ev.qty;
            var saleCost = 0;
            while (remaining > 0 && queue.length > 0) {
                if (queue[0].qty <= remaining) {
                    saleCost += queue[0].qty * queue[0].unitCost;
                    remaining -= queue[0].qty;
                    queue.shift();
                } else {
                    saleCost += remaining * queue[0].unitCost;
                    queue[0].qty -= remaining;
                    remaining = 0;
                }
            }
            // 只统计指定月份的
            if (ev.date.startsWith(ym)) {
                monthCost += saleCost;
                monthRevenue += ev.saleAmount;
                monthConsume += ev.qty;
            }
        }
    });

    // 4. 结存
    var remainQty = 0, remainValue = 0;
    queue.forEach(function(e) {
        remainQty += e.qty;
        remainValue += e.qty * e.unitCost;
    });

    return {
        cost: Math.round(monthCost * 100) / 100,
        revenue: monthRevenue,
        profit: Math.round((monthRevenue - monthCost) * 100) / 100,
        consume: Math.round(monthConsume * 100) / 100,
        remainQty: Math.round(remainQty * 100) / 100,
        remainValue: Math.round(remainValue * 100) / 100
    };
}

// 保存库存商品（新建或编辑）
function doAddInv(type, itemId) {
    var cfg = INV[type];
    var name = ($id('ai_name').value || '').trim();
    if (!name) { toast('填名称'); return; }

    if (type === 'tea') {
        var mode = $id('ai_mode').value;
        if (itemId) {
            // 编辑
            upd(function(db) {
                var it = db[cfg.key].find(function(i) { return i.id === itemId; });
                if (!it) return;
                it.name = name; it.calcMode = mode;
                if (mode === 'gram') {
                    it.costPerGram = parseFloat($id('ai_costPerGram').value) || 0;
                    it.gramsPerCup = parseFloat($id('ai_gpc').value) || 5;
                    it.gramsPerPot = parseFloat($id('ai_gpp').value) || 15;
                    it.pricePerCup = parseFloat($id('ai_ppc').value) || 0;
                    it.pricePerPot = parseFloat($id('ai_ppp').value) || 0;
                    it.openingStock = parseFloat($id('ai_os_g2').value) || 0;
                    it.restockAlert = parseInt($id('ai_ra_g').value) || 0;
                } else {
                    it.gramsPerPack = parseFloat($id('ai_gpk').value) || 250;
                    it.costPerPack = parseFloat($id('ai_cpp').value) || 0;
                    it.packsPerCup = parseFloat($id('ai_ppcup').value) || 1;
                    it.packsPerPot = parseFloat($id('ai_pppot').value) || 2;
                    it.pricePerCup = parseFloat($id('ai_ppc2').value) || 0;
                    it.pricePerPot = parseFloat($id('ai_ppp2').value) || 0;
                    it.openingStock = parseFloat($id('ai_os_p2').value) || 0;
                    it.restockAlert = parseInt($id('ai_ra_p').value) || 0;
                }
            });
            toast('已更新');
        } else {
            // 新建
            var item = { id: type + '_' + Date.now(), name: name, calcMode: mode, sales: [], purchases: [] };
            if (mode === 'gram') {
                item.costPerGram = parseFloat($id('ai_costPerGram').value) || 0;
                item.gramsPerCup = parseFloat($id('ai_gpc').value) || 5;
                item.gramsPerPot = parseFloat($id('ai_gpp').value) || 15;
                item.pricePerCup = parseFloat($id('ai_ppc').value) || 0;
                item.pricePerPot = parseFloat($id('ai_ppp').value) || 0;
                item.openingStock = parseFloat($id('ai_os_g2').value) || 0;
                item.restockAlert = parseInt($id('ai_ra_g').value) || 0;
            } else {
                item.gramsPerPack = parseFloat($id('ai_gpk').value) || 250;
                item.costPerPack = parseFloat($id('ai_cpp').value) || 0;
                item.packsPerCup = parseFloat($id('ai_ppcup').value) || 1;
                item.packsPerPot = parseFloat($id('ai_pppot').value) || 2;
                item.pricePerCup = parseFloat($id('ai_ppc2').value) || 0;
                item.pricePerPot = parseFloat($id('ai_ppp2').value) || 0;
                item.openingStock = parseFloat($id('ai_os_p2').value) || 0;
                item.restockAlert = parseInt($id('ai_ra_p').value) || 0;
            }
            upd(function(db) { db[cfg.key].push(item); });
            toast('已添加');
        }
    } else {
        if (itemId) {
            upd(function(db) {
                var it = db[cfg.key].find(function(i) { return i.id === itemId; });
                if (!it) return;
                it.name = name;
                it.costPerUnit = parseFloat($id('ai_costPerUnit').value) || 0;
                it.pricePerUnit = parseFloat($id('ai_pricePerUnit').value) || 0;
                it.openingStock = parseFloat($id('ai_os').value) || 0;
                it.restockAlert = parseInt($id('ai_ra').value) || 0;
                var pu = $id('ai_pu'); if (pu) it.purchaseUnit = pu.value;
                var cr = $id('ai_cr'); if (cr) it.purchaseConvRatio = parseInt(cr.value) || 10;
            });
            toast('已更新');
        } else {
            var item = {
                id: type + '_' + Date.now(), name: name,
                costPerUnit: parseFloat($id('ai_costPerUnit').value) || 0,
                pricePerUnit: parseFloat($id('ai_pricePerUnit').value) || 0,
                openingStock: parseFloat($id('ai_os').value) || 0,
                restockAlert: parseInt($id('ai_ra').value) || 0,
                sales: [], purchases: []
            };
            var pu = $id('ai_pu');
            item.purchaseUnit = pu ? pu.value : (type === 'cig' ? '条' : '箱');
            var cr = $id('ai_cr');
            item.purchaseConvRatio = cr ? parseInt(cr.value) || 10 : (type === 'cig' ? 10 : 12);
            upd(function(db) { db[cfg.key].push(item); });
            toast('已添加');
        }
    }
    closeModal();
    rInv(type);
}

// 通过事件委托处理库存表格中的编辑/删除按钮（避免内联 onclick）
document.addEventListener('click', function(e) {
    var card = e.target.closest('[data-inv]');
    if (!card) return;
    var parts = card.dataset.inv.split('_');
    var type = parts[0];
    var id = parts.slice(1).join('_');

    if (e.target.closest('[data-act="del"]')) {
        if (!confirm('确认删除？')) return;
        DB[INV[type].key] = DB[INV[type].key].filter(function(i) { return i.id !== id; });
        DB._ts = Date.now();
        saveDB(DB);
        sbScheduleSave;
        toast('已删除');
        rInv(type);
    } else if (e.target.closest('[data-act="edit"]')) {
        showAddInv(type, id);
    }
});

// 单个商品进销存计算
function invCalc(item, type) {
    // 总入库数量（采购/进货）
    var tp = item.purchases.reduce(function(s, p) { return s + p.qty; }, 0);

    // ===== 茗茶计算 =====
    // 茗茶比较特殊：按杯/壶卖，按克/包进货
    // 两种计算模式：'pack'（按包）和 'weight'（按克）
    if (type === 'tea') {
        // 总销售杯数、壶数、总营收
        var tc = item.sales.reduce(function(s, r) { return s + (r.cups || 0); }, 0);
        var tp2 = item.sales.reduce(function(s, r) { return s + (r.pots || 0); }, 0);
        var rev = item.sales.reduce(function(s, r) { return s + r.amount; }, 0);

        var cost, stock;
        if (item.calcMode === 'pack') {
            // 按包计算：每杯用几包 × 包成本
            cost = (tc * (item.packsPerCup || 0) + tp2 * (item.packsPerPot || 0))
                 * (item.costPerPack || 0);
            stock = (item.openingStock || 0) + tp;
        } else {
            // 按克计算：每杯几克 × 每克成本
            cost = tc * (item.gramsPerCup || 0) * (item.costPerGram || 0)
                 + tp2 * (item.gramsPerPot || 0) * (item.costPerGram || 0);
            stock = (item.openingStock || 0) + tp;
        }

        return {
            stock: stock,       // 当前库存
            revenue: rev,       // 总销售额
            cost: cost,         // 总成本（FIFO近似）
            profit: rev - cost, // 毛利
            margin: rev > 0 ? (rev - cost) / rev * 100 : 0  // 毛利率%
        };
    }

    // ===== 香烟/酒类计算 =====
    // 按瓶/包卖，按瓶/包进货，计算简单
    var ts = item.sales.reduce(function(s, r) { return s + (r.qty || 0); }, 0);  // 总销售数量
    var rev = item.sales.reduce(function(s, r) { return s + r.amount; }, 0);      // 总营收
    var cost = ts * (item.costPerUnit || 0);  // 总成本 = 销售数量 × 单位成本

    return {
        stock: (item.openingStock || 0) + tp - ts,  // 期初 + 入库 - 销售
        revenue: rev,
        cost: cost,
        profit: rev - cost,
        margin: rev > 0 ? (rev - cost) / rev * 100 : 0
    };
}

// 月度进销存计算
function invCalcMon(item, type, ym) {
    // 筛选出该月份的销售记录
    var sales = item.sales.filter(function(s) { return s.date && s.date.startsWith(ym); });
    var revenue = 0, cost = 0;

    if (type === 'tea') {
        // 茗茶：按杯/壶计算成本
        sales.forEach(function(s) {
            revenue += (s.amount || 0);
            cost += ((s.cups || 0) * (item.gramsPerCup || 5)
                   + (s.pots || 0) * (item.gramsPerPot || 15))
                   * (item.costPerGram || 0);
        });
    } else {
        // 香烟/酒类：按数量计算成本
        sales.forEach(function(s) {
            revenue += (s.amount || 0);
            cost += (s.qty || 0) * (item.costPerUnit || 0);
        });
    }

    return {
        revenue: revenue,  // 本月营收
        cost: cost,        // 本月成本
        actual: revenue    // 实收（目前等于营收）
    };
}

    var items = DB.whItems || [];
    var lowCount = items.filter(function(i) {

    }).length;

    // 顶部按钮
    var h = '<div class="brow" style="margin-bottom:16px">';
    h += '<button class="btn" onclick="showAddWH()">+添加</button> ';

// 执行入库/出库操作，更新库存和记录
function doWhMoveAll(dir) {
    var itemId = document.getElementById('mvItem').value;
    var qty = parseInt(document.getElementById('whQty').value);
    if (isNaN(qty) || qty <= 0) { toast('填数量'); return; }
    var date = document.getElementById('whDate').value || td();
    var reason = document.getElementById('whReason').value || '';

    upd(function(db) {
        var it = db.whItems.find(function(i) { return i.id === itemId; });
        if (!it) return;
        if (!it.movements) it.movements = [];
        it.movements.push({ date: date, qty: dir > 0 ? qty : -qty, reason: reason });
        it.stock = Math.max(0, it.stock + dir * qty);
    });
    closeModal();
    toast((dir > 0 ? '入库' : '出库') + ' ' + qty);
    rWH();
}

// 编辑出入库记录
function editWHMove(id, idx) {
    var item = DB.whItems.find(function(i) { return i.id === id; });
    if (!item || !item.movements[idx]) return;
    var m = item.movements[idx];

    var h = '<h3>编辑出入库 · ' + item.name + '</h3>';
    h += '<div class="hrow"><label>日期</label><input class="inp" id="ewm_date" type="text" readonly placeholder="选择日期" value="' + m.date + '" onclick="_dpOpen(\'ewm_date\')" style="max-width:150px;cursor:pointer"></div>';
    h += '<div class="hrow"><label>类型</label><select class="inp" id="ewm_type" style="max-width:100px">';
    h += '<option value="1"' + (m.qty > 0 ? ' selected' : '') + '>入库</option>';
    h += '<option value="-1"' + (m.qty < 0 ? ' selected' : '') + '>出库</option>';
    h += '</select></div>';
    h += '<div class="hrow"><label>数量</label><input class="inp" id="ewm_qty" type="number" step="any" value="' + Math.abs(m.qty) + '" style="max-width:120px">';
    h += '<span style="font-size:.78rem;color:var(--tx-m)">' + item.unit + '</span></div>';
    h += '<div class="hrow"><label>原因</label><input class="inp" id="ewm_reason" value="' + (m.reason || '') + '" style="flex:1"></div>';

    h += '<div class="brow" style="margin-top:12px;justify-content:flex-end">';
    h += '<button class="btn p" onclick="saveWHMove(\'' + id + '\',' + idx + ')">保存</button>';
    h += '<button class="btn" onclick="closeModal();setTimeout(function(){whDetail(\'' + id + '\')},100)">取消</button>';
    h += '</div>';

    showModal(h, 450);
}

// 保存编辑
function saveWHMove(id, idx) {
    var item = DB.whItems.find(function(i) { return i.id === id; });
    if (!item || !item.movements[idx]) return;

    var oldQty = item.movements[idx].qty;
    var dir = parseInt($id('ewm_type').value);
    var newQty = Math.abs(parseFloat($id('ewm_qty').value) || 0) * dir;

    // 更新库存：先减旧的，再加新的
    item.stock = item.stock - oldQty + newQty;
    item.stock = Math.round(item.stock * 100) / 100;

    item.movements[idx].date = $id('ewm_date').value;
    item.movements[idx].qty = newQty;
    item.movements[idx].reason = $id('ewm_reason').value.trim();

    saveDB();
    closeModal();
    toast('已更新');
    setTimeout(function() { whDetail(id); }, 100);
}

// 删除出入库记录
function delWHMove(id, idx) {
    var item = DB.whItems.find(function(i) { return i.id === id; });
    if (!item || !item.movements[idx]) return;

    var m = item.movements[idx];
    var desc = (m.qty > 0 ? '入库' : '出库') + ' ' + Math.abs(m.qty) + item.unit;
    if (!confirm('删除这条' + desc + '记录？')) return;

    // 减去该记录的库存影响
    item.stock = item.stock - m.qty;
    item.stock = Math.round(item.stock * 100) / 100;

    item.movements.splice(idx, 1);
    saveDB();
    toast('已删除');
    setTimeout(function() { whDetail(id); }, 100);
}

// 添加报损记录
function doAddDmg() {
    var itemSel = $id('dmgItem').value;
    if (!itemSel) { toast('选物品'); return; }

    // 获取物品名称
    var itemName = '', itemId = '';
    if (itemSel === '_other') {
        // 手动输入的物品名
        itemName = $id('dmgName').value.trim();
        if (!itemName) { toast('填物品名'); return; }
    } else {
        // 从库存列表中查找
        itemId = itemSel;
        var src = $id('dmgSource').value;
        var list = null;
        if (src === '茗茶') list = DB.teaItems;
        else if (src === '香烟') list = DB.cigItems;
        else if (src === '酒类') list = DB.alcItems;
        else if (src === '仓库') list = DB.whItems;

        if (list) {
            var it = list.find(function(i) { return i.id === itemSel; });
            itemName = it ? it.name : '';
        }
    }
    if (!itemName) { toast('物品无效'); return; }

    var qty = parseInt($id('dmgQty').value) || 0;
    if (qty <= 0) { toast('填数量'); return; }

    upd(function(db) {
        db.damageRecords.push({
            id: 'dmg_' + Date.now(),
            date: $id('dmgDate').value || td(),
            category: $id('dmgSource').value || '其他',
            itemId: itemId,
            itemName: itemName,
            qty: qty,
            unit: $id('dmgUnit').value.trim(),
            reason: $id('dmgReason').value.trim(),
            photoFile: _dmgPhotoData || ''
        });
    });

    _dmgPhotoData = null;
    toast('已记录 ' + itemName + ' ' + qty);
    rDamage();
}

        db.damageRecords = db.damageRecords.filter(function(d) { return d.id !== id; });

}
