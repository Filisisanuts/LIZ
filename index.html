// 月度财务报告主页：核心指标 + 子标签导航 + 多维度报表
function rReport() {
    var ym = curYM();

    // 月份选择器
    var h = '<div class="hrow"><label>月份</label>';
    h += '<input class="inp" id="repM" type="text" readonly placeholder="选择月份" value="' + ym + '" onclick="_mpOpen(\'repM\')" onchange="rReport()" style="max-width:180px;cursor:pointer">';
    h += '</div>';

    var m = $id('repM') ? $id('repM').value || ym : ym;
    var mr = getMR(m);

    // ===== 营收汇总 =====
    var mNet = mr.reduce(function(s, r) { return s + (r.revenue.netSales || 0); }, 0);
    var mGross = mr.reduce(function(s, r) { return s + (r.revenue.grossSales || 0); }, 0);
    var mKit = mr.reduce(function(s, r) { return s + (r.revenue.kitchenSales || 0); }, 0);
    var mBar = mr.reduce(function(s, r) { return s + (r.revenue.barSales || 0); }, 0);
    var mDel = mr.reduce(function(s, r) { return s + (r.delivery.total || 0); }, 0);
    var mCigRev = mr.reduce(function(s, r) { return s + (r.revenue.cigarette.total || 0); }, 0);
    var mOther = mr.reduce(function(s, r) { return s + (r.revenue.other || 0); }, 0);
    var mDiscount = mr.reduce(function(s, r) { return s + (r.revenue.discount || 0); }, 0);
    var mGuests = mr.reduce(function(s, r) { return s + (r.guest.count || 0); }, 0);

    // ===== 支付方式汇总 =====
    var mPos = mr.reduce(function(s, r) { return s + (r.payment.pos || 0); }, 0);
    var mCcb = mr.reduce(function(s, r) { return s + (r.payment.ccbLife || 0); }, 0);
    var mCash = mr.reduce(function(s, r) { return s + (r.payment.cash || 0); }, 0);
    var mMember = mr.reduce(function(s, r) { return s + (r.payment.memberCard || 0); }, 0);
    var mTreat = mr.reduce(function(s, r) { return s + (r.payment.treat || 0); }, 0);
    var mAr = mr.reduce(function(s, r) { return s + (r.payment.ar.total || 0); }, 0);

    // ===== 外卖渠道汇总 =====
    var mDelMeituan = mr.reduce(function(s, r) { return s + (r.delivery.meituan || 0); }, 0);
    var mDelTaobao = mr.reduce(function(s, r) { return s + (r.delivery.taobao || 0); }, 0);
    var mDelJd = mr.reduce(function(s, r) { return s + (r.delivery.jd || 0); }, 0);

    // ===== 库存销售统计 =====
    var teaS = DB.teaItems.map(function(item) {
        var mc = invCalcMon(item, 'tea', m);
        return { item: item, revenue: mc.revenue, cost: mc.cost, profit: mc.revenue - mc.cost };
    });
    var cigS = DB.cigItems.map(function(item) {
        var mc = invCalcMon(item, 'cig', m);
        return { item: item, revenue: mc.revenue, cost: mc.cost, profit: mc.revenue - mc.cost };
    });
    var alcS = DB.alcItems.map(function(item) {
        var mc = invCalcMon(item, 'alc', m);
        return { item: item, revenue: mc.revenue, cost: mc.cost, profit: mc.revenue - mc.cost };
    });

    var teaRev = teaS.reduce(function(s, st) { return s + st.revenue; }, 0);
    var teaCost = teaS.reduce(function(s, st) { return s + st.cost; }, 0);
    var teaProfit = teaRev - teaCost;

    var cigRev = cigS.reduce(function(s, st) { return s + st.revenue; }, 0);
    var cigCost = cigS.reduce(function(s, st) { return s + st.cost; }, 0);
    var cigProfit = cigRev - cigCost;

    var alcRev = alcS.reduce(function(s, st) { return s + st.revenue; }, 0);
    var alcCost = alcS.reduce(function(s, st) { return s + st.cost; }, 0);
    var alcProfit = alcRev - alcCost;

    // ===== 采购汇总 =====
    var mPur = DB.purchases.filter(function(p) { return p.date.startsWith(m); });
    var purTotal = 0, retTotal = 0, purBySec = {};
    mPur.forEach(function(p) {
        p.items.forEach(function(item) {
            var src = item.source || p.source || '外购';
            var sec = item.section || '其他';
            if (src === '退货') {
                retTotal += item.total;
            } else {
                purTotal += item.total;
                if (!purBySec[sec]) purBySec[sec] = 0;
                purBySec[sec] += item.total;
            }
        });
    });
    var netPur = purTotal - retTotal;

    // ===== 费用汇总 =====
    var mExp = DB.expenses.filter(function(e) { return e.date.startsWith(m); });
    var expTotal = mExp.reduce(function(s, e) { return s + e.amount; }, 0);
    var expByCat = {};
    mExp.forEach(function(e) {
        if (!expByCat[e.category]) expByCat[e.category] = 0;
        expByCat[e.category] += e.amount;
    });

    // ===== 分区域成本 =====
    var kitCost = purBySec['厨房'] || 0;
    var barCost = purBySec['吧台'] || 0;
    var outCost = purBySec['外场'] || 0;
    var barNoTea = mBar - teaRev;
    if (barNoTea < 0) barNoTea = mBar;
    var otherCost = netPur - kitCost - barCost - outCost;
    if (otherCost < 0) otherCost = 0;

    // ===== 利润计算 =====
    var grossProfit = mNet - netPur;
    var grossMargin = mNet > 0 ? grossProfit / mNet * 100 : 0;
    var operProfit = grossProfit - expTotal;
    var operMargin = mNet > 0 ? operProfit / mNet * 100 : 0;

    // 分类毛利
    var barGP = barNoTea - barCost;
    var teaGP = teaProfit;
    var cigGP = cigProfit;
    var alcGP = alcProfit;
    var delGP = mDel;
    var kitGP = mKit - kitCost;
    if (kitGP < 0) kitGP = mKit * 0.5;
    var otherGP = mOther - otherCost;
    if (otherGP < 0) otherGP = mOther * 0.5;

    var avgSpend = mGuests > 0 ? mNet / mGuests : 0;
    var daysReported = mr.length || 1;
    var yy = m.split('-')[0];
    var mm = m.split('-')[1];

    // 页面标题
    h += '<div class="sec" style="text-align:center;margin-bottom:4px">';
    h += '<div style="font-size:1.2rem;font-weight:700;color:var(--ac);letter-spacing:.05em">岸香咖啡弘皓大厦店</div>';
    h += '<div style="font-size:.78rem;color:var(--tx-m);letter-spacing:.1em">FINANCIAL REPORT · ' + yy + '.' + mm + '</div>';
    h += '</div>';

    // 核心指标卡片
    h += '<div class="cards" style="margin-bottom:20px">';
    h += '<div class="card"><div class="card-l">总流水</div><div class="card-v ac">' + fmtC(mGross) + '</div></div>';
    h += '<div class="card"><div class="card-l">总实收</div><div class="card-v ac">' + fmtC(mNet) + '</div></div>';
    h += '<div class="card"><div class="card-l">总毛利</div><div class="card-v gn">' + fmtC(grossProfit) + '</div></div>';
    h += '<div class="card"><div class="card-l">毛利率</div><div class="card-v gn">' + grossMargin.toFixed(1) + '%</div></div>';
    h += '<div class="card"><div class="card-l">营业利润</div><div class="card-v ' + (operProfit >= 0 ? 'gn' : 'rd') + '">' + fmtC(operProfit) + '</div></div>';
    h += '<div class="card"><div class="card-l">到店人数</div><div class="card-v">' + mGuests + '</div></div>';
    h += '</div>';

    // 子标签导航栏
    h += '<div class="rep-nav" id="repNav" style="display:flex;gap:0;overflow-x:auto;margin-bottom:20px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);scrollbar-width:none"></div>';
    h += '<div id="repBody"></div>';

    setMain('财务报告', h);

    // 子标签配置
    var tabs = [
        { id: 'profit', label: '利润表' },
        { id: 'revenue', label: '营收总表' },
        { id: 'cost', label: '成本费用' },
        { id: 'catgp', label: '分类毛利' }
    ];
    if (cigRev > 0) tabs.push({ id: 'cig', label: '香烟' });
    if (teaRev > 0) tabs.push({ id: 'tea', label: '茗茶' });
    if (alcRev > 0) tabs.push({ id: 'alc', label: '酒类' });
    tabs.push({ id: 'daily', label: '每日营收' });
    tabs.push({ id: 'guest', label: '客情包厢' });

    // 渲染子标签按钮
    var navH = '';
    tabs.forEach(function(t, i) {
        navH += '<button class="rep-tab' + (i === 0 ? ' active' : '') + '" data-tab="' + t.id + '" ';
        navH += 'style="flex-shrink:0;padding:10px 16px;font-size:.76rem;color:var(--tx-m);';
        navH += 'background:none;border:none;border-bottom:2px solid transparent;';
        navH += 'cursor:pointer;transition:all .2s;white-space:nowrap">';
        navH += t.label + '</button>';
    });
    $id('repNav').innerHTML = navH;

    // 子标签切换逻辑
    function switchRepTab(id) {
        document.querySelectorAll('.rep-tab').forEach(function(b) {
            b.classList.toggle('active', b.dataset.tab === id);
            b.style.color = b.classList.contains('active') ? 'var(--ac)' : 'var(--tx-m)';
            b.style.borderBottomColor = b.classList.contains('active') ? 'var(--ac)' : 'transparent';
        });
        renderRepSection(id);
    }

    document.querySelectorAll('.rep-tab').forEach(function(b) {
        b.onclick = function() { switchRepTab(b.dataset.tab); };
    });

    // 渲染子标签内容（闭包可访问所有汇总变量）
    function renderRepSection(id) {
        var s = $id('repBody');
        if (!s) return;

        // 缓存数据给图表使用
        window._repData = {
            net: mNet, netPur: netPur, gp: grossProfit,
            expTotal: expTotal, op: operProfit,
            kit: mKit, bar: mBar, del: mDel,
            cig: cigRev, alc: alcRev, other: mOther,
            pos: mPos, ccb: mCcb, cash: mCash,
            member: mMember, ar: mAr,
            purBySec: purBySec, expByCat: expByCat,
            kitGP: kitGP, barGP: barGP, teaGP: teaGP,
            delGP: delGP, cigGP: cigGP, alcGP: alcGP,
            barNoTea: barNoTea, tea: teaRev,
            cigS: cigS, teaS: teaS, alcS: alcS,
            mr: mr
        };

        var sh = '';
        if (id === 'profit') {
            sh += renderProfitTable(mNet, mGross, mDiscount, kitCost, barCost, outCost, teaCost, cigCost, alcCost, otherCost, netPur, expTotal, expByCat, grossProfit, grossMargin, operProfit, operMargin);
        } else if (id === 'revenue') {
            sh += renderRevenueSection(mNet, mGross, mDiscount, mKit, mBar, mDel, mCigRev, alcRev, mOther, mPos, mCcb, mCash, mMember, mTreat, mAr, mDelMeituan, mDelTaobao, mDelJd);
        } else if (id === 'cost') {
            sh += renderCostSection(purBySec, netPur, kitCost, barCost, outCost, teaCost, cigCost, alcCost, expByCat, expTotal);
        } else if (id === 'catgp') {
            sh += renderCatGPSection(mKit, mBar, barNoTea, teaRev, mDel, mCigRev, alcRev, kitCost, barCost, teaCost, cigCost, alcCost, kitGP, barGP, teaGP, delGP, cigGP, alcGP);
        } else if (id === 'cig') {
            sh += renderCigSection(cigS, cigRev, cigCost, cigProfit, m);
        } else if (id === 'tea') {
            sh += renderTeaSection(teaS, teaRev, teaCost, teaProfit, m);
        } else if (id === 'alc') {
            sh += renderAlcSection(alcS, alcRev, alcCost, alcProfit, m);
        } else if (id === 'daily') {
            sh += renderDailySection(mr, mNet, mGuests, daysReported);
        } else if (id === 'guest') {
            sh += renderGuestSection(mr, mGuests, m);
        }

        s.innerHTML = sh;
        setTimeout(function() { initRepCharts(id); }, 100);
    }

    setTimeout(function() { switchRepTab('profit'); }, 100);
}

// ==================== 利润表 ====================
function renderProfitTable(net, gross, discount, kitC, barC, outC, teaC, cigC, alcC, otherC, netPur, expTotal, expByCat, gp, gm, op, om) {
    var ym = $id('repM') ? $id('repM').value : curYM();
    var yy = ym.split('-')[0];
    var mm = parseInt(ym.split('-')[1]);

    // 利润表数据行
    var rows = [
        { l: '营业收入（实收）', v: net, n: '流水' + fmtC(gross) + ' 减折扣' + fmtC(discount) },
        { l: '减：营业成本', v: netPur, n: '净采购' },
        { l: '  厨房采购', v: kitC, n: '' },
        { l: '  吧台采购', v: barC, n: '' },
        { l: '  外场采购', v: outC, n: '' },
        { l: '  茗茶库存价值', v: teaC, n: '' },
        { l: '  香烟销售成本', v: cigC, n: '' },
        { l: '  酒类库存价值', v: alcC, n: '' }
    ];
    if (otherC > 0) rows.push({ l: '  其他采购', v: otherC, n: '' });
    rows.push({ l: '毛利', v: gp, n: '毛利率 ' + gm.toFixed(1) + '%' });
    rows.push({ l: '减：营业费用', v: expTotal, n: '' });
    Object.keys(expByCat).forEach(function(cat) { rows.push({ l: '  ' + cat, v: expByCat[cat], n: '' }); });
    rows.push({ l: '营业利润', v: op, n: '利润率 ' + om.toFixed(1) + '%' });

    // 标题摘要
    var h = '<div class="sec-head">';
    h += '<h4 style="font-size:.88rem;color:var(--ac);margin-bottom:6px">一、利润表</h4>';
    h += '<div style="font-size:.72rem;color:var(--tx-m);margin-bottom:14px">';
    h += mm + '月实现营收' + fmtC(net) + '元，营业成本' + fmtC(netPur) + '元，';
    h += '毛利' + fmtC(gp) + '元（' + gm.toFixed(1) + '%）。';
    h += '扣除费用' + fmtC(expTotal) + '元后，营业利润' + fmtC(op) + '元，利润率' + om.toFixed(1) + '%。';
    h += '</div></div>';

    // 图表
    h += '<div style="background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:14px">';
    h += '<canvas id="repChart" height="160"></canvas></div>';

    // 表格
    h += '<div class="tw"><table>';
    h += '<tr><th>项目</th><th class="nr">金额（元）</th><th>备注</th></tr>';
    rows.forEach(function(r) {
        var isTotal = (r.l === '毛利' || r.l === '营业利润');
        h += '<tr' + (isTotal ? ' style="background:var(--card-h)"' : '') + '>';
        h += '<td' + (isTotal ? ' style="font-weight:600"' : '') + '>' + r.l + '</td>';
        h += '<td class="nr" style="' + (isTotal ? 'font-weight:600;color:' + (r.v >= 0 ? 'var(--gn)' : 'var(--rd)') : '') + '">' + fmtC(r.v) + '</td>';
        h += '<td style="font-size:.72rem;color:var(--tx-m)">' + r.n + '</td></tr>';
    });
    h += '</table></div>';
    return h;
}

// ==================== 营收总表 ====================
function renderRevenueSection(net, gross, discount, kit, bar, del, cig, alc, other, pos, ccb, cash, member, treat, ar, delMt, delTb, delJd) {
    var total = net || 1;

    var h = '<div class="sec-head">';
    h += '<h4 style="font-size:.88rem;color:var(--ac);margin-bottom:6px">二、营收总表</h4>';
    h += '<div style="font-size:.72rem;color:var(--tx-m);margin-bottom:14px">';
    h += '总流水' + fmtC(gross) + '元，折扣' + fmtC(discount) + '元（' + (gross > 0 ? (discount / gross * 100).toFixed(1) : '0') + '%），实收' + fmtC(net) + '元。';
    h += '厨房' + (net > 0 ? (kit / net * 100).toFixed(1) : '0') + '%、';
    h += '吧台' + (net > 0 ? (bar / net * 100).toFixed(1) : '0') + '%、';
    h += '外卖' + (net > 0 ? (del / net * 100).toFixed(1) : '0') + '%。';
    h += '</div></div>';

    // 双饼图
    h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:14px">';
    h += '<div style="background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px"><canvas id="repChart1" height="250"></canvas></div>';
    h += '<div style="background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px"><canvas id="repChart2" height="250"></canvas></div>';
    h += '</div>';

    // 收入分类表格
    h += '<div class="tw"><table><tr><th>收入分类</th><th class="nr">金额（元）</th><th class="nr">占比</th></tr>';
    var items = [['厨房', kit], ['吧台（含茗茶）', bar], ['外卖', del], ['香烟', cig]];
    if (alc > 0) items.push(['酒类', alc]);
    items.push(['其他', other]);
    items.push(['合计', total]);
    items.forEach(function(it) {
        var pct = net > 0 ? (it[1] / total * 100).toFixed(1) : '0';
        var isTotal = it[0] === '合计';
        h += '<tr' + (isTotal ? ' style="background:var(--card-h)"' : '') + '>';
        h += '<td' + (isTotal ? ' style="font-weight:600"' : '') + '>' + it[0] + '</td>';
        h += '<td class="nr"' + (isTotal ? ' style="font-weight:600"' : '') + '>' + fmtC(it[1]) + '</td>';
        h += '<td class="nr">' + pct + '%</td></tr>';
    });
    h += '</table></div>';

    // 支付渠道表格
    h += '<div class="sec-head" style="margin-top:20px"><h4 style="font-size:.82rem;color:var(--ac);margin-bottom:6px">支付渠道</h4></div>';
    var payTotal = pos + ccb + cash + member + treat + del + ar;
    h += '<div class="tw"><table><tr><th>渠道</th><th class="nr">金额（元）</th><th class="nr">占比</th></tr>';
    var payItems = [['智能POS机', pos], ['建行生活', ccb], ['现金', cash], ['会员刷卡', member], ['招待', treat], ['外卖', del], ['应收账款', ar], ['合计', payTotal]];
    payItems.forEach(function(it) {
        var pct = payTotal > 0 ? (it[1] / payTotal * 100).toFixed(1) : '0';
        var isTotal = it[0] === '合计';
        h += '<tr' + (isTotal ? ' style="background:var(--card-h)"' : '') + '>';
        h += '<td' + (isTotal ? ' style="font-weight:600"' : '') + '>' + it[0] + '</td>';
        h += '<td class="nr"' + (isTotal ? ' style="font-weight:600"' : '') + '>' + fmtC(it[1]) + '</td>';
        h += '<td class="nr">' + pct + '%</td></tr>';
    });
    h += '</table></div>';
    return h;
}

// ==================== 成本费用明细 ====================
function renderCostSection(purBySec, netPur, kitC, barC, outC, teaC, cigC, alcC, expByCat, expTotal) {
    var total = netPur + expTotal;

    var h = '<div class="sec-head">';
    h += '<h4 style="font-size:.88rem;color:var(--ac);margin-bottom:6px">三、成本费用明细</h4>';
    h += '<div style="font-size:.72rem;color:var(--tx-m);margin-bottom:14px">';
    h += '采购总成本' + fmtC(netPur) + '元，费用' + fmtC(expTotal) + '元，合计' + fmtC(total) + '元。';
    h += '</div></div>';

    h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">';
    h += '<div style="background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px"><canvas id="repChart" height="200"></canvas></div>';
    h += '<div style="background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px"><canvas id="repChart2" height="200"></canvas></div>';
    h += '</div>';

    h += '<div class="tw"><table><tr><th>费用归属</th><th class="nr">金额（元）</th><th class="nr">占比</th></tr>';
    var items = [['厨房采购', kitC], ['吧台采购', barC], ['外场采购', outC], ['茗茶成本', teaC], ['香烟成本', cigC]];
    if (alcC > 0) items.push(['酒类成本', alcC]);
    Object.keys(expByCat).forEach(function(cat) { items.push([cat, expByCat[cat]]); });
    items.push(['合计', total]);
    items.forEach(function(it) {
        var pct = total > 0 ? (it[1] / total * 100).toFixed(1) : '0';
        var isTotal = it[0] === '合计';
        h += '<tr' + (isTotal ? ' style="background:var(--card-h)"' : '') + '>';
        h += '<td' + (isTotal ? ' style="font-weight:600"' : '') + '>' + it[0] + '</td>';
        h += '<td class="nr"' + (isTotal ? ' style="font-weight:600"' : '') + '>' + fmtC(it[1]) + '</td>';
        h += '<td class="nr">' + pct + '%</td></tr>';
    });
    h += '</table></div>';
    return h;
}

// ==================== 分类毛利分析 ====================
function renderCatGPSection(kit, bar, barNoTea, tea, del, cig, alc, kitC, barC, teaC, cigC, alcC, kitGP, barGP, teaGP, delGP, cigGP, alcGP) {
    var totalRev = kit + bar + del + cig + alc;
    var totalGP = kitGP + barGP + teaGP + delGP + cigGP + alcGP;

    var h = '<div class="sec-head">';
    h += '<h4 style="font-size:.88rem;color:var(--ac);margin-bottom:6px">四、分类毛利分析</h4>';
    h += '<div style="font-size:.72rem;color:var(--tx-m);margin-bottom:14px">';
    h += '厨房毛利' + fmtC(kitGP) + '元，吧台' + fmtC(barGP) + '元，茗茶' + fmtC(teaGP) + '元（最高），';
    h += '外卖' + fmtC(delGP) + '元，香烟' + fmtC(cigGP) + '元。总毛利' + fmtC(totalGP) + '元。';
    h += '</div></div>';

    h += '<div style="background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:14px">';
    h += '<canvas id="repChart" height="280"></canvas></div>';

    h += '<div class="tw"><table><tr><th>类别</th><th class="nr">收入</th><th class="nr">成本</th><th class="nr">毛利</th><th class="nr">毛利率</th></tr>';
    var items = [['厨房', kit, kitC, kitGP], ['吧台（不含茗茶）', barNoTea, barC, barGP], ['茗茶', tea, teaC, teaGP], ['外卖', del, 0, delGP], ['香烟', cig, cigC, cigGP]];
    if (alc > 0) items.push(['酒类', alc, alcC, alcGP]);
    items.push(['合计', totalRev, totalRev - totalGP, totalGP]);
    items.forEach(function(it) {
        var margin = it[1] > 0 ? (it[3] / it[1] * 100).toFixed(1) : '0';
        var isTotal = it[0] === '合计';
        h += '<tr' + (isTotal ? ' style="background:var(--card-h)"' : '') + '>';
        h += '<td' + (isTotal ? ' style="font-weight:600"' : '') + '>' + it[0] + '</td>';
        h += '<td class="nr">' + fmtC(it[1]) + '</td>';
        h += '<td class="nr">' + fmtC(it[2]) + '</td>';
        h += '<td class="nr" style="color:' + (it[3] >= 0 ? 'var(--gn)' : 'var(--rd)') + ';font-weight:600">' + fmtC(it[3]) + '</td>';
        h += '<td class="nr">' + margin + '%</td></tr>';
    });
    h += '</table></div>';
    return h;
}

// ==================== 香烟报表 ====================
function renderCigSection(stats, rev, cost, profit, ym) {
    var totalSold = stats.reduce(function(s, st) {
        return s + st.item.sales.filter(function(ss) { return ss.date.startsWith(ym); }).reduce(function(a, ss) { return a + (ss.qty || 0); }, 0);
    }, 0);

    var h = '<div class="sec-head">';
    h += '<h4 style="font-size:.88rem;color:var(--ac);margin-bottom:6px">五、香烟进销存及毛利</h4>';
    h += '<div style="font-size:.72rem;color:var(--tx-m);margin-bottom:14px">';
    h += '本月销售' + totalSold + '包，销售额' + fmtC(rev) + '元，成本' + fmtC(cost) + '元，';
    h += '毛利' + fmtC(profit) + '元（' + (rev > 0 ? (profit / rev * 100).toFixed(1) : '0') + '%）。';
    h += '</div></div>';

    h += '<div style="background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:14px">';

}

// ---------- 生成报告 ----------
function doGen(period) {
    var m = ($id('genM') || {}).value || curYM();
    var sd = 1, ed = 31;
    var title = m.replace('-', '年') + '月';

    if (period === 'first') {
        ed = 15;
        title += '上半月';
    } else if (period === 'second') {
        sd = 16;
        title += '下半月';
    } else if (period === 'custom') {
        var startVal = $id('genStart').value;
        var endVal = $id('genEnd').value;
        if (!startVal || !endVal) { toast('请选择起止日期'); return; }
        sd = parseInt(startVal.split('-')[2]);
        ed = parseInt(endVal.split('-')[2]);
        title = startVal.replace(/-/g, '/') + ' - ' + endVal.replace(/-/g, '/');
    } else {
        title += '月度';
    }
    title += '经营报告';

    // 筛选日期范围内的日报
    var mr = getMR(m).filter(function(r) {
        var d = parseInt(r.date.split('-')[2]);
        return d >= sd && d <= ed;
    });

    var days = mr.length || 1;
    var mNet = mr.reduce(function(s, r) { return s + (r.revenue.netSales || 0); }, 0);
    var mGross = mr.reduce(function(s, r) { return s + (r.revenue.grossSales || 0); }, 0);
    var mDiscount = mr.reduce(function(s, r) { return s + (r.revenue.discount || 0); }, 0);
    var mKit = mr.reduce(function(s, r) { return s + (r.revenue.kitchenSales || 0); }, 0);
    var mBar = mr.reduce(function(s, r) { return s + (r.revenue.barSales || 0); }, 0);
    var mDel = mr.reduce(function(s, r) { return s + (r.delivery.total || 0); }, 0);
    var mCig = mr.reduce(function(s, r) { return s + (r.revenue.cigarette.total || 0); }, 0);
    var mOther = mr.reduce(function(s, r) { return s + (r.revenue.other || 0); }, 0);
    var mGuests = mr.reduce(function(s, r) { return s + (r.guest.count || 0); }, 0);
    var mPos = mr.reduce(function(s, r) { return s + (r.payment.pos || 0); }, 0);
    var mCcb = mr.reduce(function(s, r) { return s + (r.payment.ccbLife || 0); }, 0);
    var mCash = mr.reduce(function(s, r) { return s + (r.payment.cash || 0); }, 0);
    var mMember = mr.reduce(function(s, r) { return s + (r.payment.memberCard || 0); }, 0);
    var mTreat = mr.reduce(function(s, r) { return s + (r.payment.treat || 0); }, 0);
    var mAr = mr.reduce(function(s, r) { return s + (r.payment.ar.total || 0); }, 0);
    var mRooms = mr.reduce(function(s, r) { return s + (r.guest.premiumRoomsToday || 0); }, 0);

    // 采购（筛选日期范围）
    var mPur = DB.purchases.filter(function(p) {
        var d = parseInt(p.date.split('-')[2]);
        return p.date.startsWith(m) && d >= sd && d <= ed;
    }).reduce(function(s, p) { return s + p.items.reduce(function(ss, i) { return ss + i.total; }, 0); }, 0);

    // 费用（筛选日期范围）
    var mExp = DB.expenses.filter(function(e) {
        var d = parseInt(e.date.split('-')[2]);
        return e.date.startsWith(m) && d >= sd && d <= ed;
    }).reduce(function(s, e) { return s + e.amount; }, 0);

    var profit = mNet - mPur - mExp;
    var profitRate = mNet > 0 ? (profit / mNet * 100).toFixed(1) : '0';
    var avgNet = mNet / days;
    var avgGuests = mGuests / days;
    var avgSpend = mGuests > 0 ? mNet / mGuests : 0;
    var costRate = mNet > 0 ? (mPur / mNet * 100).toFixed(1) : '0';
    var discountRate = mGross > 0 ? (mDiscount / mGross * 100).toFixed(1) : '0';

    // 每日明细行
    var dailyRows = '';
    var sorted = mr.slice().sort(function(a, b) { return a.date.localeCompare(b.date); });
    sorted.forEach(function(r) {
        var d = parseInt(r.date.split('-')[2]);
        var ppg = r.guest.count > 0 ? (r.revenue.netSales / r.guest.count).toFixed(0) : '-';
        var net = r.revenue.netSales || 0;
        var color = profit >= 0 ? '#3d8b5e' : '#c75450';
        dailyRows += '<tr>';
        dailyRows += '<td>' + d + '日</td>';
        dailyRows += '<td>' + num(r.revenue.grossSales || 0) + '</td>';
        dailyRows += '<td>' + num(r.revenue.discount || 0) + '</td>';
        dailyRows += '<td style="font-weight:600">' + num(net) + '</td>';
        dailyRows += '<td>' + num(r.revenue.kitchenSales || 0) + '</td>';
        dailyRows += '<td>' + num(r.revenue.barSales || 0) + '</td>';
        dailyRows += '<td>' + num(r.delivery.total || 0) + '</td>';
        dailyRows += '<td>' + (r.guest.count || 0) + '</td>';
        dailyRows += '<td>' + ppg + '</td>';
        dailyRows += '</tr>';
    });

    // 采购分类汇总
    var purBySec = {};
    DB.purchases.filter(function(p) {
        var d = parseInt(p.date.split('-')[2]);
        return p.date.startsWith(m) && d >= sd && d <= ed;
    }).forEach(function(p) {
        p.items.forEach(function(item) {
            var sec = item.section || '其他';
            if (!purBySec[sec]) purBySec[sec] = 0;
            purBySec[sec] += item.total;
        });
    });

    var purRows = '';
    Object.keys(purBySec).sort(function(a, b) { return purBySec[b] - purBySec[a]; }).forEach(function(sec) {
        var pct = mPur > 0 ? (purBySec[sec] / mPur * 100).toFixed(1) : '0';
        purRows += '<tr><td>' + sec + '</td><td>' + num(purBySec[sec]) + '</td><td>' + pct + '%</td></tr>';
    });

    // 费用分类汇总
    var expByCat = {};
    DB.expenses.filter(function(e) {
        var d = parseInt(e.date.split('-')[2]);
        return e.date.startsWith(m) && d >= sd && d <= ed;
    }).forEach(function(e) {
        if (!expByCat[e.category]) expByCat[e.category] = 0;
        expByCat[e.category] += e.amount;
    });

    var expRows = '';
    Object.keys(expByCat).sort(function(a, b) { return expByCat[b] - expByCat[a]; }).forEach(function(cat) {
        var pct = mExp > 0 ? (expByCat[cat] / mExp * 100).toFixed(1) : '0';
        expRows += '<tr><td>' + cat + '</td><td>' + num(expByCat[cat]) + '</td><td>' + pct + '%</td></tr>';
    });

    // 支付渠道行
    var payTotal = mPos + mCcb + mCash + mMember + mTreat + mDel + mAr;
    var payRows = '';
    var payItems = [
        ['智能POS机', mPos], ['建行生活', mCcb], ['现金', mCash],
        ['会员刷卡', mMember], ['招待', mTreat], ['外卖平台', mDel], ['应收账款', mAr]
    ];
    payItems.forEach(function(it) {
        var pct = payTotal > 0 ? (it[1] / payTotal * 100).toFixed(1) : '0';
        payRows += '<tr><td>' + it[0] + '</td><td>' + num(it[1]) + '</td><td>' + pct + '%</td></tr>';
    });

    // 收入结构行
    var revItems = [['厨房', mKit], ['吧台', mBar], ['外卖', mDel], ['香烟', mCig], ['其他', mOther]];
    var revRows = '';
    revItems.forEach(function(it) {
        var pct = mNet > 0 ? (it[1] / mNet * 100).toFixed(1) : '0';
        revRows += '<tr><td>' + it[0] + '</td><td>' + num(it[1]) + '</td><td>' + pct + '%</td></tr>';
    });

    // 数字格式化
    function num(n) {
        n = Math.round((n || 0) * 100) / 100;
        var parts = n.toFixed(2).split('.');
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        return parts.join('.');
    }

    // ===== 构建完整 HTML =====
    var html = '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">';
    html += '<title>' + title + '</title>';
    html += '<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;600;700&family=Lexend:wght@300;400;500;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">';
    html += '<style>';
    html += '*{margin:0;padding:0;box-sizing:border-box}';
    html += 'body{font-family:"Noto Sans SC",sans-serif;padding:40px;max-width:900px;margin:auto;color:#2c2c2c;line-height:1.8;font-size:13px}';
    html += '@media print{body{padding:20px}.no-print{display:none!important}table{page-break-inside:auto}tr{page-break-inside:avoid}}';

    // 标题区
    html += '.header{text-align:center;margin-bottom:30px;padding-bottom:20px;border-bottom:2px solid #b08d57}';
    html += '.header h1{font-family:"Playfair Display",serif;font-size:1.6rem;color:#b08d57;letter-spacing:.05em;margin-bottom:4px}';
    html += '.header .sub{color:#888;font-size:.78rem;letter-spacing:.15em}';
    html += '.header .period{color:#555;font-size:.82rem;margin-top:8px}';

    // 指标卡片
    html += '.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}';
    html += '.metric{background:#f8f6f0;border:1px solid #e8e2d8;border-radius:8px;padding:14px;text-align:center}';
    html += '.metric .label{font-size:.7rem;color:#888;letter-spacing:.05em}';
    html += '.metric .value{font-family:"Lexend",monospace;font-size:1.2rem;font-weight:600;margin-top:4px}';
    html += '.metric .value.ac{color:#b08d57}.metric .value.gn{color:#3d8b5e}.metric .value.rd{color:#c75450}';

    // 章节标题
    html += '.section{margin-bottom:24px}';
    html += '.section h2{font-size:.92rem;color:#b08d57;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #e8e2d8;letter-spacing:.03em}';
    html += '.section .desc{font-size:.78rem;color:#666;margin-bottom:10px;line-height:1.6}';

    // 表格
    html += 'table{width:100%;border-collapse:collapse;margin-bottom:8px;font-size:.8rem}';
    html += 'th{background:#f0ece4;padding:8px 12px;text-align:left;font-weight:600;color:#666;font-size:.72rem;border-bottom:1px solid #ddd}';
    html += 'td{padding:7px 12px;border-bottom:1px solid #eee;color:#333}';
    html += '.nr{text-align:right;font-family:"Lexend",monospace}';
    html += 'tr.total{background:#f8f6f0;font-weight:600}';
    html += 'tr.total td{border-top:2px solid #b08d57}';

    // 页脚
    html += '.footer{text-align:center;color:#aaa;font-size:.68rem;margin-top:40px;padding-top:16px;border-top:1px solid #eee}';

    // 打印按钮
    html += '.print-bar{position:fixed;bottom:20px;right:20px;display:flex;gap:8px;z-index:100}';
    html += '.print-btn{padding:10px 20px;border:none;border-radius:8px;font-size:.82rem;cursor:pointer;font-family:"Noto Sans SC",sans-serif;transition:all .2s}';
    html += '.print-btn.primary{background:#b08d57;color:#fff}';
    html += '.print-btn.secondary{background:#f0ece4;color:#333;border:1px solid #ddd}';
    html += '.print-btn:hover{opacity:.85;transform:translateY(-1px)}';
    html += '@media print{.print-bar{display:none}}';

    html += '</style></head><body>';

    // 打印按钮
    html += '<div class="print-bar no-print">';
    html += '<button class="print-btn secondary" onclick="window.close()">关闭</button>';
    html += '<button class="print-btn primary" onclick="window.print()">打印 / 导出PDF</button>';
    html += '</div>';

    // 标题
    html += '<div class="header">';
    html += '<h1>岸香咖啡 · ' + title + '</h1>';
    html += '<div class="sub">ANSHIANG COFFEE FINANCIAL REPORT</div>';
    html += '<div class="period">' + m.split('-')[0] + '年' + parseInt(m.split('-')[1]) + '月' + sd + '-' + ed + '日 · 共' + days + '天</div>';
    html += '</div>';

    // 核心指标
    html += '<div class="metrics">';
    html += '<div class="metric"><div class="label">总流水</div><div class="value ac">' + num(mGross) + '</div></div>';
    html += '<div class="metric"><div class="label">总实收</div><div class="value ac">' + num(mNet) + '</div></div>';
    html += '<div class="metric"><div class="label">折扣率</div><div class="value">' + discountRate + '%</div></div>';
    html += '<div class="metric"><div class="label">采购成本</div><div class="value rd">' + num(mPur) + '</div></div>';
    html += '<div class="metric"><div class="label">营业费用</div><div class="value rd">' + num(mExp) + '</div></div>';
    html += '<div class="metric"><div class="label">净利润</div><div class="value ' + (profit >= 0 ? 'gn' : 'rd') + '">' + num(profit) + '</div></div>';
    html += '<div class="metric"><div class="label">利润率</div><div class="value ' + (profit >= 0 ? 'gn' : 'rd') + '">' + profitRate + '%</div></div>';
    html += '<div class="metric"><div class="label">总客流</div><div class="value">' + mGuests + '</div></div>';
    html += '<div class="metric"><div class="label">人均消费</div><div class="value">' + num(avgSpend) + '</div></div>';
    html += '</div>';

    // 一、经营概览
    html += '<div class="section">';
    html += '<h2>一、经营概览</h2>';
    html += '<div class="desc">';
    html += '本周期实现流水<strong>' + num(mGross) + '</strong>元，折扣<strong>' + num(mDiscount) + '</strong>元（' + discountRate + '%），';
    html += '实收<strong>' + num(mNet) + '</strong>元。采购成本<strong>' + num(mPur) + '</strong>元（成本率' + costRate + '%），';
    html += '营业费用<strong>' + num(mExp) + '</strong>元。';
    html += '净利润<strong style="color:' + (profit >= 0 ? '#3d8b5e' : '#c75450') + '">' + num(profit) + '</strong>元，利润率' + profitRate + '%。';
    html += '累计到店<strong>' + mGuests + '</strong>人，日均' + avgGuests.toFixed(1) + '人，人均消费' + num(avgSpend) + '元。';
    html += '</div></div>';

    // 二、收入结构
    html += '<div class="section">';
    html += '<h2>二、收入结构</h2>';
    html += '<table><tr><th>分类</th><th class="nr">金额（元）</th><th class="nr">占比</th></tr>';
    html += revRows;
    html += '<tr class="total"><td>合计</td><td class="nr">' + num(mNet) + '</td><td class="nr">100%</td></tr>';
    html += '</table></div>';

    // 三、支付渠道
    html += '<div class="section">';
    html += '<h2>三、支付渠道</h2>';
    html += '<table><tr><th>渠道</th><th class="nr">金额（元）</th><th class="nr">占比</th></tr>';
    html += payRows;
    html += '<tr class="total"><td>合计</td><td class="nr">' + num(payTotal) + '</td><td class="nr">100%</td></tr>';
    html += '</table></div>';

    // 四、采购成本
    if (mPur > 0) {
        html += '<div class="section">';

        html += '<tr class="total"><td>合计</td><td class="nr">' + num(mPur) + '</td><td class="nr">100%</td></tr>';
        html += '</table></div>';
    }

    // 五、营业费用
    if (mExp > 0 && Object.keys(expByCat).length > 0) {
        html += '<div class="section">';
        html += '<h2>' + (mPur > 0 ? '五' : '四') + '、营业费用</h2>';
        html += '<table><tr><th>费用类别</th><th class="nr">金额（元）</th><th class="nr">占比</th></tr>';
        html += expRows;
        html += '<tr class="total"><td>合计</td><td class="nr">' + num(mExp) + '</td><td class="nr">100%</td></tr>';
        html += '</table></div>';
    }

    // 每日明细
    html += '<div class="section">';
    html += '<h2>每日经营明细</h2>';
    html += '<table><tr><th>日期</th><th class="nr">流水</th><th class="nr">折扣</th><th class="nr">实收</th><th class="nr">厨房</th><th class="nr">吧台</th><th class="nr">外卖</th><th class="nr">客流</th><th class="nr">人均</th></tr>';
    html += dailyRows;
    html += '<tr class="total"><td>合计</td><td class="nr">' + num(mGross) + '</td><td class="nr">' + num(mDiscount) + '</td><td class="nr">' + num(mNet) + '</td><td class="nr">' + num(mKit) + '</td><td class="nr">' + num(mBar) + '</td><td class="nr">' + num(mDel) + '</td><td class="nr">' + mGuests + '</td><td class="nr">' + num(avgSpend) + '</td></tr>';
    html += '</table></div>';

    // 页脚

    html += '</body></html>';

    // 在新窗口打开
    var win = window.open('', '_blank');
    if (win) {
        win.document.write(html);
        win.document.close();
        toast('报告已生成，请在新窗口中按 Ctrl+P 打印或导出PDF');
    } else {
        toast('弹窗被拦截，请允许弹窗后重试');
    }
}

// ==================== 16. Supabase 云同步 ====================
var _sb = { client: null, ready: false, saving: false };

// 初始化连接
function sbInit() {
    var url = localStorage.getItem('ax_sb_url');
    var key = localStorage.getItem('ax_sb_key');
    if (!url || !key) return;
    if (typeof supabase === 'undefined') { console.warn('Supabase SDK 未加载'); return; }
    _sb.client = supabase.createClient(url, key);
    _sb.ready = true;
    console.log('Supabase 已连接');
}

// 连接（设置页调用）
function sbConnect() {
    var url = ($id('sbUrl')||{}).value||''; url = url.trim();
    var key = ($id('sbKey')||{}).value||''; key = key.trim();
    if (!url || !key) { toast('请填写 URL 和 Key'); return; }
    localStorage.setItem('ax_sb_url', url);
    localStorage.setItem('ax_sb_key', key);
    _sb.client = supabase.createClient(url, key);
    _sb.ready = true;
    toast('Supabase 已连接');
    sbSyncOnStart().then(function() { rData(); });
}

// 断开连接
function sbDisconnect() {
    if (!confirm('断开 Supabase 同步？')) return;
    localStorage.removeItem('ax_sb_url');
    localStorage.removeItem('ax_sb_key');
    _sb = { client: null, ready: false, saving: false };
    updSyncInd();
    rData();
    toast('已断开');
}

// 从云端下载数据
async function sbLoad() {
    if (!_sb.ready) return null;
    try {
        var resp = await _sb.client.from('cafe_data').select('data, updated_at').eq('id', 'main').single();
        if (resp.error || !resp.data) return null;
        var remote = resp.data.data;
        if (remote._ts && remote._ts > (DB._ts || 0)) return remote;
    } catch (e) { console.warn('Supabase 读取失败:', e); }
    return null;
}

// 上传数据到云端
async function sbSave() {
    if (!_sb.ready || _sb.saving) return;
    _sb.saving = true;
    DB._ts = Date.now();
    try {
        var resp = await _sb.client.from('cafe_data').upsert({ id: 'main', data: DB, updated_at: new Date().toISOString() });
        if (resp.error) console.warn('Supabase 保存失败:', resp.error);
        else console.log('Supabase 已同步');
    } catch (e) { console.warn('Supabase 保存异常:', e); }
    _sb.saving = false;
    updSyncInd();
}

// 防抖保存（数据变更后2秒自动上传）
var _sbTimer = null;
function sbScheduleSave() {
    if (!_sb.ready) return;
    if (_sbTimer) clearTimeout(_sbTimer);
    _sbTimer = setTimeout(sbSave, 2000);
}

// 启动时同步：优先下载云端最新数据
async function sbSyncOnStart() {
    if (!_sb.ready) return;
    var remote = await sbLoad();
    if (remote) { DB = remote; saveDB(DB); toast('云端已加载'); }
}

// 更新同步状态指示灯
function updSyncInd() {

        : '<span class="sync-dot" style="background:var(--tx-m)"></span>本地';
}

// ==================== 17. GitHub 同步 ====================

// 存储键名
var GH_KEY = 'ax_gh_cfg';

// 全局同步状态
// token: GitHub Token
// gistId: 数据 Gist 的 ID
// mediaGistId: 媒体文件 Gist 的 ID（预留）
// ready: 是否已连接
// saving: 是否正在保存（防止重复请求）
var _gh = { token: '', gistId: '', mediaGistId: '', ready: false, saving: false };

// ---------- 读取本地配置 ----------
function ghGetCfg() {
    try { return JSON.parse(localStorage.getItem(GH_KEY)) || {}; }
    catch (e) { return {}; }
}

// ---------- 保存本地配置 ----------
function ghSaveCfg(c) {
    localStorage.setItem(GH_KEY, JSON.stringify(c));
}

// ---------- 初始化同步 ----------
// 从 localStorage 读取 Token，如果存在则标记为已连接
function ghInit() {
    var c = ghGetCfg();
    if (!c.token) return false;
    _gh.token = c.token;
    _gh.gistId = c.gistId || '';
    _gh.mediaGistId = c.mediaGistId || '';
    _gh.ready = true;
    return true;
}

// ---------- 搜索已有 Gist ----------
// 遍历用户的 Gist 列表（最多5页），找到描述为 'ax_cafe_data' 的
async function ghFindGist() {
    if (!_gh.ready) return null;
    try {
        var pg = 1;
        while (pg <= 5) {
            var r = await fetch('https://api.github.com/gists?per_page=100&page=' + pg, {
                headers: { 'Authorization': 'token ' + _gh.token }
            });
            if (!r.ok) return null;
            var gs = await r.json();
            if (!gs.length) break;
            for (var i = 0; i < gs.length; i++) {
                if (gs[i].description === 'ax_cafe_data') return gs[i];
            }
            pg++;
        }
        return null;
    } catch (e) { return null; }
}

// ---------- 从 GitHub 下载数据 ----------
// 只有远程数据更新时间（_ts）比本地新时才返回数据
async function ghLoad() {
    if (!_gh.ready || !_gh.gistId) return null;
    try {
        var r = await fetch('https://api.github.com/gists/' + _gh.gistId, {
            headers: { 'Authorization': 'token ' + _gh.token }
        });
        if (!r.ok) return null;
        var g = await r.json();
        var f = g.files && g.files['ax_cafe_data.json'];
        if (f && f.content) {
            var d = JSON.parse(f.content);
            if (d._ts && d._ts > (DB._ts || 0)) return d;
        }
    } catch (e) {}
    return null;
}

// ---------- 上传数据到 GitHub ----------
// 有 gistId 就更新，没有就新建
// saving 锁防止重复提交
async function ghSave() {
    if (!_gh.ready || !_gh.token || _gh.saving) return;
    _gh.saving = true;
    updSyncInd();
    DB._ts = Date.now();

    try {
        var url = _gh.gistId
            ? 'https://api.github.com/gists/' + _gh.gistId
            : 'https://api.github.com/gists';
        var r = await fetch(url, {
            method: _gh.gistId ? 'PATCH' : 'POST',
            headers: {
                'Authorization': 'token ' + _gh.token,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                description: 'ax_cafe_data',
                files: { 'ax_cafe_data.json': { content: JSON.stringify(DB) } }
            })
        });
        if (r.ok) {
            var g = await r.json();
            // 新建的 Gist，保存 gistId
            if (!_gh.gistId) {
                _gh.gistId = g.id;
                var c = ghGetCfg();
                c.gistId = g.id;
                ghSaveCfg(c);
            }
        }
    } catch (e) {}

    _gh.saving = false;
    updSyncInd();
}

// ---------- 启动时同步 ----------
// 优先下载远程数据（如果远程更新的话），否则上传本地数据
async function ghSyncOnStart() {
    if (!_gh.ready) return;
    var cur = curPage;
    var remote = await ghLoad();
    if (remote) {
        DB = remote;
        saveDB(DB);
        toast('云端已加载');
    } else if (DB.dailyReports.length) {
        await ghSave();
        toast('已上传');
    }
    // 同步完成后恢复当前页面
    if (cur) {
        curPage = cur;
        _curPage = cur;
        renderNav();
    }
}

// ---------- 设置 Token 并连接 ----------
// 流程：保存Token → 尝试已存gistId → 搜索已有Gist → 新建Gist
async function ghSetToken(t) {
    t = t.trim();
    if (!t) return;

    _gh.token = t;
    _gh.ready = true;
    var c = ghGetCfg();
    c.token = t;
    ghSaveCfg(c);
    _gh.gistId = c.gistId || '';
    _gh.mediaGistId = c.mediaGistId || '';

    toast('连接中...');

    // 第一步：尝试已保存的 gistId
    if (_gh.gistId) {
        try {
            var r = await fetch('https://api.github.com/gists/' + _gh.gistId, {
                headers: { 'Authorization': 'token ' + _gh.token }
            });
            if (r.ok) {
                toast('已找到数据');
                await ghSyncOnStart();
                updSyncInd();
                rData();
                return;
            }
        } catch (e) {}
    }

    // 第二步：搜索用户所有 Gist 找已有的
    var ex = await ghFindGist();
    if (ex) {
        _gh.gistId = ex.id;
        c = ghGetCfg();
        c.gistId = ex.id;
        ghSaveCfg(c);
        toast('找到已有数据');
        await ghSyncOnStart();
    } else {
        // 第三步：都没找到，新建一个
        await ghSave();
        c = ghGetCfg();
        c.gistId = _gh.gistId;
        ghSaveCfg(c);
        toast('已连接');
    }

    updSyncInd();
    rData();
}

// ---------- 断开连接 ----------
function ghDisconnect() {
    if (!confirm('断开？')) return;
    localStorage.removeItem(GH_KEY);
    _gh = { token: '', gistId: '', mediaGistId: '', ready: false, saving: false };
    updSyncInd();
    rData();
    toast('已断开');
}

// ---------- 更新顶部同步状态指示灯 ----------
// 绿色圆点 = 已同步，灰色圆点 = 仅本地
function updSyncInd() {

// ---------- 延迟保存（防抖）----------
// 数据变化后等 1.5 秒再上传，避免频繁请求
var _ghTimer = null;
function sbScheduleSave() {
    if (!_gh.ready) return;
    if (_ghTimer) clearTimeout(_ghTimer);
    _ghTimer = setTimeout(ghSave, 1500);
}

// ==================== 18. 同步码 ====================
// ---------- 生成同步码 ----------
function genSyncCode() {
    try {
        var data = JSON.stringify(DB);
        var encoded = btoa(unescape(encodeURIComponent(data)));

        // 分块显示（避免单行过长）
        var chunkSize = 1000;
        var chunks = [];
        for (var i = 0; i < encoded.length; i += chunkSize) {
            chunks.push(encoded.substring(i, i + chunkSize));
        }

        var h = '<h3>数据同步码</h3>';
        h += '<div style="font-size:.72rem;color:var(--tx-m);margin-bottom:10px">数据大小：' + (encoded.length / 1024).toFixed(1) + 'KB</div>';
        h += '<textarea id="syncCodeOutput" style="width:100%;height:300px;font-family:monospace;font-size:.7rem;resize:vertical" readonly>' + chunks.join('\n') + '</textarea>';
        h += '<div class="brow" style="margin-top:10px;justify-content:flex-end">';
        h += '<button class="btn p" onclick="copySyncCode()">复制全部</button>';
        h += '<button class="btn" onclick="closeModal()">关闭</button></div>';
        showModal(h, 600);
    } catch (e) {
        toast('生成同步码失败：' + e.message);
    }
}

// ---------- 复制同步码 ----------
function copySyncCode() {
    var textarea = $id('syncCodeOutput');
    if (!textarea) return;

    textarea.select();
    textarea.setSelectionRange(0, 99999); // 兼容移动端

    try {
        document.execCommand('copy');
        toast('已复制到剪贴板');
    } catch (e) {
        // 尝试使用现代API
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(textarea.value)
                .then(function() { toast('已复制到剪贴板'); })
                .catch(function() { toast('复制失败，请手动选择复制'); });
        } else {
            toast('复制失败，请手动选择复制');
        }
    }
}

// ---------- 导入同步码 ----------
function importSyncCode() {
    var h = '<h3>导入同步码</h3>';
    h += '<div style="font-size:.74rem;color:var(--tx-m);margin-bottom:10px">粘贴之前生成的同步码，将覆盖当前所有数据</div>';
    h += '<textarea id="syncCodeInput" style="width:100%;height:300px;font-family:monospace;font-size:.7rem;resize:vertical" placeholder="粘贴同步码..."></textarea>';
    h += '<div class="brow" style="margin-top:10px">';
    h += '<button class="btn p" onclick="doImportSyncCode()">导入</button>';
    h += '<button class="btn" onclick="closeModal()">取消</button></div>';
    showModal(h, 600);
}

// ---------- 执行导入 ----------
function doImportSyncCode() {
    var input = $id('syncCodeInput');
    if (!input) return;

    var code = (input.value || '').trim();
    if (!code) { toast('请粘贴同步码'); return; }

    // 去掉可能的换行符
    code = code.replace(/\n/g, '').replace(/\r/g, '');

    try {
        var decoded = decodeURIComponent(escape(atob(code)));
        var data = JSON.parse(decoded);

        // 简单验证数据结构
        if (!data.dailyReports && !data.purchases && !data.expenses) {
            toast('同步码格式错误：缺少必要数据');
            return;
        }

        if (!confirm('确认导入？这将覆盖当前所有数据！')) return;

        DB = data;
        saveDB(DB);
        sbScheduleSave;
        toast('导入成功');
        closeModal();
        goPage(_curPage || 'dash'); // 刷新当前页面
    } catch (e) {
        toast('导入失败：同步码格式错误或已损坏');
        console.error('导入同步码失败:', e);
    }
}


// ==================== 19. 初始化 ====================

// ---------- 应用启动 ----------
function appInit() {
    DB = loadDB();
    initConfig();

    migrateAreaCats();

    applyTheme(); applyFonts(); applySpacing(); initToolbar();
    var savedFS = localStorage.getItem('ax_fs');
    if (savedFS) document.documentElement.style.fontSize = savedFS + 'px';
    var savedR = localStorage.getItem('ax_radius');
    if (savedR) document.documentElement.style.setProperty('--r', savedR + 'px');
    if (['ax_font_heading','ax_font_body','ax_font_number'].some(function(k){return localStorage.getItem(k)})) applyFonts();

    document.addEventListener('click', function(e) {
        if (e.target.id === 'overlay') closeModal();
    });

    renderNav();
    goPage('dash');

    var headerDate = document.getElementById('headerDate');
    if (headerDate) {
        var today = new Date();
        var dow = ['日','一','二','三','四','五','六'][today.getDay()];
        headerDate.textContent = today.getFullYear() + '.' +
            String(today.getMonth()+1).padStart(2,'0') + '.' +
            String(today.getDate()).padStart(2,'0') + ' 星期' + dow;
    }

    sbInit();
    if (_sb.ready) sbSyncOnStart();
    updSyncInd();

    console.log('岸香咖啡经营管理系统初始化完成');
}

// ---------- 滚动时调整导航栏样式 ----------
window.addEventListener('scroll', function() {
  var fnav = $id('fnav');
  if (!fnav) return;
  if (window.scrollY > 10) fnav.classList.add('scrolled');
  else fnav.classList.remove('scrolled');
});

// ---------- 初始化工具栏 ----------
function initToolbar() {
  var groups = {
    toolbarMain: [],
    toolbarInv: [],
    toolbarReport: [],
    toolbarSys: []
  };

  // 按分隔符分组
  var currentGroup = 'toolbarMain';
  NAV.forEach(function(item) {
    if (item.sep) {
      // 遇到分隔符，切换到下一组
      if (currentGroup === 'toolbarMain') currentGroup = 'toolbarInv';
      else if (currentGroup === 'toolbarInv') currentGroup = 'toolbarReport';
      else if (currentGroup === 'toolbarReport') currentGroup = 'toolbarSys';
      return;
    }
    groups[currentGroup].push(item);
  });

  // 渲染每组
  Object.keys(groups).forEach(function(containerId) {
    var el = $id(containerId);
    if (!el) return;
    el.innerHTML = groups[containerId].map(function(p) {
      return '<button class="toolbar-btn" data-page="' + p.id + '" onclick="goPage(\'' + p.id + '\')" title="' + p.label + '">' +
        '<span class="ticon">' + p.icon + '</span>' +
        '<span class="tlabel">' + p.label + '</span>' +
        (p.badge ? '<span class="badge-dot"></span>' : '') +
        '</button>';
    }).join('');
  });

  // 默认高亮总览
  var first = $id('toolbarMain');
  if (first) {
    var btn = first.querySelector('.toolbar-btn');
    if (btn) btn.classList.add('active');
  }
}

// ---------- 页面加载完成后启动 ----------
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', appInit);
} else {
    appInit();
}


// ==================== 20. Chart.js 加载 ====================

// Chart.js 多源加载（防止单一CDN失效）
var _chartSrcs = [
    'https://cdn.bootcdn.net/ajax/libs/Chart.js/4.4.0/chart.umd.min.js',
    'https://unpkg.com/chart.js@4.4.0/dist/chart.umd.min.js',
    'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js'
];

function _loadChart(i) {
    if (i >= _chartSrcs.length) {
        console.warn('Chart.js 加载失败，图表功能不可用');
        return;
    }
    var s = document.createElement('script');
    s.src = _chartSrcs[i];
    s.onload = function() {
        window._chartLoaded = true;
        console.log('Chart.js 加载成功');
    };
    s.onerror = function() {
        console.warn('Chart.js CDN ' + (i + 1) + ' 失败，尝试下一个...');
        _loadChart(i + 1);
    };
    document.head.appendChild(s);
}

// 开始加载Chart.js
_loadChart(0);

// ==================== 21. 结束 ====================

</script>
